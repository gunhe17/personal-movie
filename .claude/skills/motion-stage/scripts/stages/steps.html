<!doctype html>
<meta charset="utf-8">
<title>절차 표시줄</title>
<!--
  씬 상단의 절차 표시줄. 단계를 전부 나열하고 현재 단계를 알약으로 채운다. 배경 투명 — 편집에서 위 트랙에 0,0으로 얹는다.
  from/to가 한 순간을 고른다: from=to=k 스틸 · k→k+1 알약 이동 · 0→1 등장 · k→0 퇴장. 진행은 duration 전체에 걸친다
  (마지막 프레임이 정확히 도착 상태 — 스틸 PNG와 이음매 없이 붙는다). 전역 render(t) 규약(CDP 캡처).
-->
<style>
:root{ --f-b:'Apple SD Gothic Neo','Pretendard',system-ui,sans-serif; --f-m:'SF Mono',ui-monospace,monospace }
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:transparent}
.stage{position:relative;width:100vw;height:100vh;overflow:hidden;container-type:size;font-family:var(--f-b)}
.bar{position:absolute;left:50%;top:1.5cqw;display:flex;align-items:center;gap:.3cqw;padding:.36cqw;white-space:nowrap;
  border-radius:99cqw;   /* 바탕은 spec의 ground — 불투명으로 둔다. 반투명은 알파를 straight로 읽는 편집기에서 탁하게 뜬다 */
  box-shadow:inset 0 0 0 .07cqw rgba(25,30,33,.10),0 .5cqw 1.8cqw rgba(25,30,33,.16)}
.tag{font-size:.72cqw;font-weight:600;letter-spacing:.06em;padding:0 .6cqw 0 .9cqw}
.pill{position:absolute;top:.36cqw;bottom:.36cqw;border-radius:99cqw}
.item{position:relative;display:flex;align-items:center;gap:.5cqw;padding:.5cqw 1cqw .5cqw .5cqw;font-size:.98cqw;font-weight:600;letter-spacing:-.01em}
.dot{width:1.35cqw;height:1.35cqw;border-radius:50%;display:grid;place-items:center;font-family:var(--f-m);font-size:.66cqw}
.dot>*{grid-area:1/1}
.dot svg{width:.78cqw;height:.78cqw}
.sep{width:.6cqw;height:.08cqw}
</style>
<div class="stage"><div class="bar" id="bar"><div class="pill" id="pill"></div></div></div>
<script>
const SPEC = /*__SPEC__*/ null;
const S = { ...{
  steps:['접수','전달','도착'],
  tag:'',              // 줄 왼쪽의 작은 이름. 비우면 없다
  ground:'#FFFFFF',    // 줄 바탕
  ink:'#191E21',       // 줄 위 글자
  accent:'#2F6BFF',    // 현재 단계 알약 색
  onAccent:'#FFFFFF',  // 알약 위 글자
  from:1, to:1,        // 0 = 줄이 없다
  duration:null, fps:30
}, ...(SPEC || {}) };

const bar = document.getElementById('bar'), pill = document.getElementById('pill');
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const rgba = (c, al) => `rgba(${c.map(Math.round).join(',')},${al.toFixed(3)})`;
const INK = hex(S.ink), ON = hex(S.onAccent), ACC = hex(S.accent);
bar.style.background = S.ground;
pill.style.background = S.accent;
if (S.tag){ const g = document.createElement('div'); g.className = 'tag'; g.textContent = S.tag; g.style.color = rgba(INK, .5); bar.appendChild(g); }
const items = S.steps.map((name, i) => {
  if (i){ const s = document.createElement('div'); s.className = 'sep'; s.style.background = rgba(INK, .16); bar.appendChild(s); }
  const d = document.createElement('div'); d.className = 'item';
  d.innerHTML = `<div class="dot"><span>${i + 1}</span><svg viewBox="0 0 12 12"><path d="M2.5 6.3l2.3 2.3 4.7-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></div><span class="t">${name}</span>`;
  bar.appendChild(d);
  return { el: d, dot: d.querySelector('.dot'), n: d.querySelector('.dot span'), ck: d.querySelector('svg'), t: d.querySelector('.t') };
});

const clamp = v => v < 0 ? 0 : v > 1 ? 1 : v;
const ease = u => { u = clamp(u); return u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2; };
const mix = (a, b, p) => a + (b - a) * p;
const edges = k => { const e = items[k - 1].el; return [e.offsetLeft, e.offsetLeft + e.offsetWidth]; };
// 줄 위 글자(ink) → 알약 위에서는 onAccent. 지나간 단계의 점은 강조색으로 물든다
const mixc = (x, y, p) => x.map((v, i) => mix(v, y[i], p));

function render(t){
  const span = S.duration ? Math.max(S.duration - 1 / S.fps, 1e-3) : 0;
  const p = span ? clamp(t / span) : 1;
  const { from, to } = S;
  const show = from === 0 ? ease(p) : to === 0 ? 1 - ease(p) : 1;
  const c = from === 0 ? to : to === 0 ? from : mix(from, to, ease(p));   // 연속 위치 — 글자색이 알약을 따라간다

  bar.style.opacity = show.toFixed(4);
  bar.style.transform = `translateX(-50%) translateY(${((show - 1) * .8).toFixed(3)}cqw) scale(${mix(.96, 1, show).toFixed(4)})`;

  // 알약: 앞 가장자리가 먼저 떠나고 뒤 가장자리가 따라온다 — 늘었다 줄며 건너간다
  let L, R;
  if (from && to && from !== to){
    const [al, ar] = edges(from), [bl, br] = edges(to);
    const lead = ease(p * 1.3), lag = ease(p * 1.3 - .3), fwd = to > from;
    L = mix(al, bl, fwd ? lag : lead); R = mix(ar, br, fwd ? lead : lag);
  } else [L, R] = edges(from || to);
  pill.style.left = `${L.toFixed(2)}px`; pill.style.width = `${(R - L).toFixed(2)}px`;

  items.forEach((e, i) => {
    const k = i + 1;
    const a = clamp(1 - Math.abs(c - k));      // 현재 단계인 정도
    const done = clamp(c - k);                  // 지나간 정도
    const mark = mixc(mixc(INK, ACC, done), ON, a);
    e.t.style.color = rgba(mixc(INK, ON, a), mix(mix(.46, .72, done), 1, a));
    e.dot.style.background = rgba(mark, mix(mix(.07, .14, done), .26, a));
    e.dot.style.color = rgba(mark, mix(mix(.55, 1, done), 1, a));
    // 숫자가 먼저 빠지고 체크가 뒤에 든다 — 같이 교차하면 중간에 둘이 겹쳐 뭉개진다
    e.n.style.opacity = (1 - clamp(done / .4)).toFixed(3);
    e.ck.style.opacity = clamp((done - .5) / .4).toFixed(3);
  });
}
render(parseFloat(new URLSearchParams(location.search).get('t') || '0'));
</script>
