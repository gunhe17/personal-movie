<title>폰 글라스 스테이지</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@300;400;500;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<!--
  imac 무대의 형제다. 배경(블롭·도트·그레인) · 유리 재질 · 카피 열 · 매트 규약(.matte-black/.matte-white)이
  전부 같고, **기기만 세로 폰**이다. 화면 슬롯은 9:19.5 — s04의 폰-웹 촬영본(1170×2532 · SPEC v7 phone)이
  그 비율이라 잘림이 없다. 치수는 iMac처럼 전부 컨테이너 비율이되, 폰은 **높이가 먼저 정해지는 물건**이라
  cqh를 쓴다(가로로 넓은 무대에서 폭 기준으로 잡으면 화면 밖으로 넘친다).
-->
<style>
:root{ --ink:#0E1B2E; --f-b:'Apple SD Gothic Neo','Pretendard','Gothic A1',system-ui,sans-serif; --f-m:'SF Mono','IBM Plex Mono',ui-monospace,monospace; }
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:transparent}
.stage{position:relative;width:100vw;height:100vh;overflow:hidden;container-type:size;
       font-family:var(--f-b);color:var(--ink)}

.blob{position:absolute;border-radius:50%;filter:blur(9cqw)}
.dots{position:absolute;inset:0;
  -webkit-mask-image:radial-gradient(120% 95% at 50% 45%,#000 35%,transparent 78%);
          mask-image:radial-gradient(120% 95% at 50% 45%,#000 35%,transparent 78%)}
.grain{position:absolute;inset:0;opacity:.35;mix-blend-mode:overlay;
  background-image:radial-gradient(rgba(255,255,255,.9) .8px,transparent .9px);
  background-size:.55cqw .55cqw}

.lay{position:absolute;inset:0;display:grid;align-items:center;padding:0 6cqw 0 5cqw;gap:5cqw}

/* ── 폰 ── */
.phone{position:relative;height:var(--ph,84cqh);justify-self:center;
       filter:drop-shadow(0 4cqh 5cqh rgba(11,30,66,.34))}
.frame{position:relative;height:100%;border-radius:5.2cqh;padding:.62cqh;
  background:linear-gradient(150deg,rgba(255,255,255,.60),rgba(255,255,255,.20) 42%,rgba(255,255,255,.42));
  -webkit-backdrop-filter:blur(2.4cqw) saturate(165%);backdrop-filter:blur(2.4cqw) saturate(165%);
  border:.14cqh solid rgba(255,255,255,.75);
  box-shadow:inset 0 .16cqh .6cqh rgba(255,255,255,.95),
             inset 0 -.3cqh 1cqh rgba(31,58,110,.09),
             0 .7cqh 1.8cqh rgba(20,45,95,.10)}
/* 유리 위를 지나는 반사 띠 — imac과 같은 각도 변수 */
.frame::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(var(--sheen,112deg),transparent 26%,rgba(255,255,255,.50) 40%,rgba(255,255,255,.06) 52%,transparent 62%)}
.frame::before{content:"";position:absolute;left:14%;right:14%;top:.2cqh;height:.9cqh;border-radius:50%;
  background:rgba(255,255,255,.72);filter:blur(.5cqh);pointer-events:none}

/* 화면 — **띠 · 영상 슬롯 · 띠** 세 층이다.
   촬영본을 화면 전체에 깔면 둥근 모서리(4.7cqh)가 페이지의 맨 윗줄과 맨 아랫줄을 잘라 먹는다.
   그래서 실제 폰의 상태표시줄·홈 인디케이터 자리만큼 **위아래를 비워 두고** 그 안쪽에만 영상을 넣는다.
   모서리가 자르는 것은 그 빈 띠뿐이라 콘텐츠는 한 픽셀도 안 잘린다(2026-09-11).
   슬롯의 비율은 촬영본 그대로(1170:2532)이고, 높이가 정해지면 폭이 따라오고 화면 폭이 거기 맞춰진다. */
.screen{position:relative;height:100%;width:var(--slotW);display:flex;flex-direction:column;
  border-radius:4.7cqh;overflow:hidden;background:var(--screenBg,#fff);z-index:2}
.band{width:100%;flex:0 0 auto;background:var(--screenBg,#fff)}
.band.top{height:var(--statusH,3.8cqh)}
.band.bottom{height:var(--homeH,2.6cqh)}
.slot{position:relative;width:100%;height:var(--slotH);overflow:hidden;background:#F7F9FC}
.slot .shot{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
/* 매트 모드 — imac과 같은 규약. **슬롯만** 순흑/순백으로 굽는다.
   띠는 두 판에서 똑같이 흰색이라 차이에 안 잡히고, 그래서 합성 사각형에서 빠진다. */
.matte .slot .app,.matte .slot .ph,.matte .speaker,.matte .side-btn{display:none}
.matte-black .slot{background:#000}
.matte-white .slot{background:#fff}
/* 띠는 두 판에서 같은 색이어야 차이에 안 잡힌다 — 매트 때는 screenBg를 무시하고 흰색으로 고정 */
.matte .screen,.matte .band{background:#fff}

/* 수화부 슬릿과 측면 버튼 — **화면 밖에만** 둔다.
   촬영본은 브라우저 페이지라 상태바가 없다. 다이내믹 아일랜드를 화면 위에 얹으면 페이지 맨 윗줄
   (마인드스코프 로고)을 가린다 — 그래서 아일랜드는 두지 않는다. */
.speaker{position:absolute;left:50%;top:.26cqh;width:9%;height:.34cqh;border-radius:.3cqh;
  background:rgba(20,40,80,.30);transform:translateX(-50%);z-index:3}
.side-btn{position:absolute;right:-.34cqh;top:22%;width:.34cqh;height:7.5cqh;border-radius:.3cqh;
  background:linear-gradient(180deg,rgba(255,255,255,.7),rgba(255,255,255,.32));
  border:.07cqh solid rgba(255,255,255,.6)}
.floor{width:var(--fw,26cqh);height:1.4cqh;margin:1.4cqh auto 0;border-radius:50%;
  background:rgba(18,40,84,.22);filter:blur(1.1cqh)}

/* ── 자리표시 UI (screen 없이 미리볼 때만) ── */
.app{position:absolute;inset:0;display:flex;flex-direction:column;gap:1.2cqh;padding:3cqh 2cqh;font-size:1.4cqh}
.bar{height:2cqh;border-radius:.6cqh;background:#E7EDF6}
.bar.w60{width:60%}.bar.w34{width:34%;background:#2F6BFF;opacity:.85}
.rows{display:flex;flex-direction:column;gap:.8cqh;margin-top:1cqh}
.row{height:5.4cqh;border-radius:1cqh;background:#F1F5FB;border:.1cqh solid #E2E9F4}
.ph{position:absolute;left:50%;bottom:2cqh;transform:translateX(-50%);
  font-family:var(--f-m);font-size:1.1cqh;letter-spacing:.12em;color:#8FA3BE}

/* ── 카피 (imac과 동일) ── */
.copy .eyebrow{font-family:var(--f-m);font-size:1cqw;letter-spacing:.2em;color:#3E5F96;margin:0 0 1.4cqw}
.copy h2{font-weight:800;font-size:3.7cqw;line-height:1.28;letter-spacing:-.03em;margin:0;color:#0B1A31;word-break:keep-all;text-wrap:balance}
.copy p{margin:1.6cqw 0 0;font-size:1.3cqw;line-height:1.8;color:#33496B;max-width:24cqw;word-break:keep-all}
.tag{position:absolute;left:2.4cqw;bottom:2cqw;font-family:var(--f-m);font-size:.85cqw;letter-spacing:.18em;color:rgba(14,27,46,.42);margin:0}
</style>
<div class="stage" id="stage"></div>
<script>
const SPEC = /*__SPEC__*/ null;
const q = new URLSearchParams(location.search);
const SHOT = q.get('shot');
const FILL = q.get('fill');

const S = { ...{
  ground:'#DCE7F7', phoneH:84, sheen:112, dots:1.5, dotOpacity:.5,
  blobs:[
    { c:'#2F6BFF', o:.55, w:78, x:-8,  y:-26, from:'left,top' },
    { c:'#6FC2F5', o:.62, w:56, x:-6,  y:-14, from:'right,top' },
    { c:'#FFFFFF', o:.55, w:46, x:34,  y:6,   from:'left,top' },
    { c:'#94A6FF', o:.55, w:62, x:22,  y:-32, from:'left,bottom' },
    { c:'#C7B4F2', o:.55, w:40, x:6,   y:-16, from:'right,bottom' },
    { c:'#F3C3DC', o:.40, w:30, x:-4,  y:2,   from:'left,bottom' }
  ],
  statusH:3.8, homeH:2.6, screenBg:'#fff',   // 촬영본이 기기 전체 화면(상태바 포함)이면 띠를 0으로 두고 바탕을 그 색으로
      // 화면 위아래로 비워 두는 띠(cqh) — 둥근 모서리가 여기만 자른다
  copy:null, tag:null, phoneW:1, right:null   // right — 우측을 이만큼(무대 폭 비율) 비운다. copy가 있으면 그 열이 우선
}, ...(SPEC || {}) };

const st = document.getElementById('stage');
if (FILL) st.classList.add('matte', `matte-${FILL}`);
st.style.setProperty('--sheen', S.sheen + 'deg');
st.style.setProperty('--ph', S.phoneH + 'cqh');
st.style.setProperty('--screenBg', S.screenBg);
st.style.setProperty('--statusH', S.statusH + 'cqh');
st.style.setProperty('--homeH', S.homeH + 'cqh');
// 슬롯 치수는 계산해서 박는다 — 플렉스 안에서 `aspect-ratio`는 높이가 정해져도 폭을 안 잡아
// 폰이 막대가 된다(실측). 높이가 먼저 정해지는 물건이므로 높이 → 폭 순서로 푼다.
const SHOT_RATIO = S.shotRatio ?? 1170 / 2532;        // 폰-웹 촬영본(SPEC v7 phone). 시뮬레이터 판은 804/1748
const slotH = S.phoneH - S.statusH - S.homeH;
st.style.setProperty('--slotH', slotH + 'cqh');
st.style.setProperty('--slotW', (slotH * SHOT_RATIO) + 'cqh');
st.style.background = S.ground;

let html = '<div id="bg" style="position:absolute;inset:0">';
for (const b of S.blobs){
  const [ax, ay] = b.from.split(',');
  html += `<div class="blob" style="width:${b.w}cqw;height:${b.w}cqw;background:${b.c};opacity:${b.o};${ax}:${b.x}cqw;${ay}:${b.y}cqw"></div>`;
}
html += `<div class="dots" style="opacity:${S.dotOpacity};background-image:radial-gradient(rgba(255,255,255,.55) 1.1px,transparent 1.2px);background-size:${S.dots}cqw ${S.dots}cqw"></div><div class="grain"></div></div>`;

const placeholder = `
  <div class="app">
    <div class="bar w60"></div>
    <div class="bar w34"></div>
    <div class="rows"><div class="row"></div><div class="row"></div><div class="row"></div></div>
  </div>
  <span class="ph">SCREEN SLOT</span>`;

const copyHTML = S.copy ? `<div class="copy">
    ${S.copy.eyebrow ? `<p class="eyebrow">${S.copy.eyebrow}</p>` : ''}
    ${S.copy.h ? `<h2>${S.copy.h}</h2>` : ''}
    ${S.copy.p ? `<p>${S.copy.p}</p>` : ''}
  </div>` : '';

html += `<div class="lay" id="lay" style="grid-template-columns:${S.copy ? S.phoneW + 'fr 1.6fr' : '1fr'};padding:${S.copy ? '0 6cqw 0 6cqw' : S.right != null ? `0 ${S.right * 100}cqw 0 0` : '0'}">
    <div class="phone">
      <div class="frame">
        <div class="speaker"></div>
        <div class="screen">
          <div class="band top"></div>
          <div class="slot" id="screen">${SHOT ? `<img class="shot" src="${SHOT}">` : placeholder}</div>
          <div class="band bottom"></div>
        </div>
      </div>
      <div class="side-btn"></div>
      <div class="floor"></div>
    </div>
    ${copyHTML}
  </div>`;
if (S.tag) html += `<p class="tag">${S.tag}</p>`;
st.innerHTML = html;

/* imac과 같은 계약 — CDP가 프레임마다 부른다. 폰 무대는 pull을 쓰지 않지만 계약은 맞춰 둔다. */
async function render(t, shot){
  const scr = document.getElementById('screen');
  if (shot){
    let img = scr.querySelector('img.shot');
    if (!img){ scr.innerHTML = ''; img = document.createElement('img'); img.className = 'shot'; scr.appendChild(img); }
    if (img.getAttribute('src') !== shot){ img.src = shot; try { await img.decode(); } catch {} }
  }
}
render(parseFloat(q.get('t') || '0'), SHOT || null);
</script>
