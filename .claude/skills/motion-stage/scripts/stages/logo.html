<title>logo</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:transparent}
#stage{position:relative;width:100vw;height:100vh;overflow:hidden;container-type:size}
.layer{position:absolute;inset:0}
.blob{position:absolute;border-radius:50%;filter:blur(9cqw)}
.dots{position:absolute;inset:0;
  -webkit-mask-image:radial-gradient(120% 95% at 50% 45%,#000 35%,transparent 78%);
          mask-image:radial-gradient(120% 95% at 50% 45%,#000 35%,transparent 78%)}
.grain{position:absolute;inset:0;opacity:.35;mix-blend-mode:overlay;
  background-image:radial-gradient(rgba(255,255,255,.9) .8px,transparent .9px);background-size:.55cqw .55cqw}
#win{position:absolute;inset:0;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center}
</style>
<div id="stage">
  <div class="layer" id="ground"></div>
  <div class="layer" id="full"></div>
  <div id="win"><div class="layer" id="white"></div><div class="layer" id="pattern"></div></div>
</div>
<script>
/* 로고 인트로 — 흰 로고가 가운데 등장해 한 번 튀고, 끝없이 커진다.
   로고는 '창'(mask)이다: 창 안이 흰색 → 목업 배경 무늬로 바뀌고, 창이 화면을 넘어서면 배경이 곧 그 무늬가 된다.
   무늬(blobs · dots · grain)는 imac.html과 같은 정의다 — 바꾸면 둘 다 바꾼다. */
const SPEC = /*__SPEC__*/ null;
const q = new URLSearchParams(location.search);
const S = { ...{
  ground0:'#0E1B2E',        // 로고가 나타나기 전 배경. 'transparent'면 오버레이로 쓴다
  ground:'#DCE7F7', dots:1.5, dotOpacity:.5,
  blobs:[
    { c:'#2F6BFF', o:.55, w:78, x:-8,  y:-26, from:'left,top' },
    { c:'#6FC2F5', o:.62, w:56, x:-6,  y:-14, from:'right,top' },
    { c:'#FFFFFF', o:.55, w:46, x:34,  y:6,   from:'left,top' },
    { c:'#94A6FF', o:.55, w:62, x:22,  y:-32, from:'left,bottom' },
    { c:'#C7B4F2', o:.55, w:40, x:6,   y:-16, from:'right,bottom' },
    { c:'#F3C3DC', o:.40, w:30, x:-4,  y:2,   from:'left,bottom' }
  ],
  logoSvg:null,             // render.mjs가 spec.logo 파일을 읽어 넣는다. 없으면 아래 대역 마크
  logoW:0.20,               // 등장 시 로고 폭 (무대 폭 비율)
  cover:16,                 // 끝 크기 = 등장 크기 × cover (로고 실루엣이 화면을 다 덮을 만큼)
  pop:0.62, hold:0.45, grow:1.5, tail:0.4   // 구간(초): 튀며 등장 · 숨 · 끝없이 커짐 · 배경 정착
}, ...(SPEC || {}) };

/* 대역 마크 — 실제 로고 SVG가 없을 때만. 원 + M. 실제 로고를 spec.logo 로 준다. */
const FALLBACK = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="48"/><path d="M28 70V32l22 22 22-22v38h-9V50L50 63 37 50v20z" fill="#fff"/></svg>`;
const logoURL = `url("data:image/svg+xml;utf8,${encodeURIComponent(S.logoSvg || FALLBACK)}")`;

/* 배경 무늬 — imac.html과 동일 */
function patternHTML(){
  let h = '';
  for (const b of S.blobs){ const [ax, ay] = b.from.split(','); h += `<div class="blob" style="width:${b.w}cqw;height:${b.w}cqw;background:${b.c};opacity:${b.o};${ax}:${b.x}cqw;${ay}:${b.y}cqw"></div>`; }
  h += `<div class="dots" style="opacity:${S.dotOpacity};background-image:radial-gradient(rgba(255,255,255,.55) 1.1px,transparent 1.2px);background-size:${S.dots}cqw ${S.dots}cqw"></div><div class="grain"></div>`;
  return h;
}
const ground = document.getElementById('ground'), full = document.getElementById('full'),
      win = document.getElementById('win'), white = document.getElementById('white'), pattern = document.getElementById('pattern');
ground.style.background = S.ground0;
full.style.background = S.ground; full.innerHTML = patternHTML(); full.style.opacity = 0;      // 마지막에 창 없이 전체
pattern.style.background = S.ground; pattern.innerHTML = patternHTML(); pattern.style.opacity = 0;
white.style.background = '#fff';
win.style.webkitMaskImage = win.style.maskImage = logoURL;

const clamp = v => v < 0 ? 0 : v > 1 ? 1 : v;
const easeOut = u => 1 - Math.pow(1 - clamp(u), 3);
const easeIn3 = u => Math.pow(clamp(u), 3);
const smooth = u => { u = clamp(u); return u*u*(3 - 2*u); };
/* 통 한 번: 0 → 1.18 → 0.96 → 1 */
function popScale(u){
  if (u < 0.55) return 1.18 * easeOut(u / 0.55);
  if (u < 0.80) return 1.18 - 0.22 * smooth((u - 0.55) / 0.25);
  return 0.96 + 0.04 * smooth((u - 0.80) / 0.20);
}

function render(t){
  const W = innerWidth, w0 = S.logoW * W;
  const t1 = S.pop, t2 = t1 + S.hold, t3 = t2 + S.grow;
  let scale, mix = 0, fullOp = 0;
  if (t < t1)      scale = popScale(t / t1);
  else if (t < t2) scale = 1;
  else {
    const u = clamp((t - t2) / S.grow);
    scale = 1 + (S.cover - 1) * easeIn3(u);                 // 끝없이 — 가속하며 커진다
    mix = smooth((u - 0.15) / 0.55);                          // 흰색 → 무늬
    fullOp = smooth((u - 0.85) / 0.15);                       // 창이 화면을 넘어설 즈음 전체를 그 무늬로 굳힌다
  }
  if (t >= t3){ scale = S.cover; mix = 1; fullOp = 1; }
  const w = Math.max(0.1, w0 * scale);
  win.style.webkitMaskSize = win.style.maskSize = `${w.toFixed(2)}px auto`;
  win.style.opacity = t < t1 ? smooth(t / (t1 * 0.35)) : 1;
  pattern.style.opacity = mix;
  full.style.opacity = fullOp;
}
render(parseFloat(q.get('t') || '0'));
</script>
