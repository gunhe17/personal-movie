<title>transition</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:transparent}
#stage{position:relative;width:100vw;height:100vh;overflow:hidden}
#fill{position:absolute;inset:0}
</style>
<div id="stage"><div id="fill"></div></div>
<script>
/* 전환 무대 — '채움' 한 장을 마스크로 깎아 모양을 만든다.
   matte:true  → 검정 위에 흰 모양 (루마 매트 · 편집기 트랙 매트 / ffmpeg alphamerge)
   matte:false → 투명 위에 color 모양 (RGBA 오버레이)
   기하는 아래 maskFor() 하나다. _motion/transitions/index.html 의 데모와 글자 단위로 같아야 한다. */
const SPEC = /*__SPEC__*/ null;
const q = new URLSearchParams(location.search);
const S = { ...{
  preset:'wipe',       // wipe | iris | band | dots | slices | liquid | ink | shape
  dir:'right',         // right left down up down-right down-left up-right up-left
  feather:0.08, ease:'inout', duration:0.8, invert:false,
  color:'#191E21', opacity:1,
  width:0.35,          // band — 띠 폭
  center:[0.5,0.5],    // iris
  cell:48, stagger:0.5,// dots — 셀(px@1920) · 방향 지연
  slices:12, alternate:false, // slices
  scale:90, freq:0.006, seed:7, // liquid · ink
  shape:'rect', ratio:16/9, spin:720, size0:0.06, from:[0.12,0.88], to:[0.5,0.5], exit:[0.88,0.12], cover:false, // shape
  matte:false
}, ...(SPEC || {}) };
const MATTE = S.matte === true || q.get('matte') === '1';

/* ── 공유 기하 (index.html과 동일) ── */
const ANG = { right:90, left:270, down:180, up:0, 'down-right':135, 'down-left':225, 'up-right':45, 'up-left':315 };
const VEC = { right:[1,0], left:[-1,0], down:[0,1], up:[0,-1], 'down-right':[.7071,.7071], 'down-left':[-.7071,.7071], 'up-right':[.7071,-.7071], 'up-left':[-.7071,-.7071] };
const EASE = { linear:u=>u, in:u=>u*u*u, out:u=>1-Math.pow(1-u,3), inout:u=>u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2 };
const clamp = v => v < 0 ? 0 : v > 1 ? 1 : v;
const pct = v => (v * 100).toFixed(3) + '%';
const svgURL = (W, H, inner) => `url("data:image/svg+xml;utf8,${encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${inner}</svg>`)}")`;
function alongDir(S, x, y, W, H){                       // 점의 dir 방향 위치 0..1
  const [dx, dy] = VEC[S.dir] || VEC.right;
  const c = [[0,0],[W,0],[0,H],[W,H]].map(([px,py]) => px*dx + py*dy);
  const mn = Math.min(...c), mx = Math.max(...c);
  return ((x*dx + y*dy) - mn) / (mx - mn);
}
function maskFor(S, p, W, H){
  const f = S.feather, k = W / 1920;                     // k: 1920 기준 px 스케일
  const on = S.invert ? 'transparent' : '#000', off = S.invert ? '#000' : 'transparent';
  const finish = (defs, shapes) => svgURL(W, H, defs + (S.invert
    ? `<mask id="m"><rect width="${W}" height="${H}" fill="#fff"/>${shapes}</mask><rect width="${W}" height="${H}" fill="#000" mask="url(#m)"/>`
    : shapes));
  const blurDef = f > 0 ? `<filter id="fb" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="${(f*W*0.12).toFixed(1)}"/></filter>` : '';
  const grp = s => `<g fill="#000"${f > 0 ? ' filter="url(#fb)"' : ''}>${s}</g>`;

  switch (S.preset){
    case 'iris': {
      const [cx, cy] = S.center;
      const R = Math.hypot(Math.max(cx, 1-cx)*W, Math.max(cy, 1-cy)*H);
      const r = p*(1+f)*R, fr = f*R;
      return `radial-gradient(circle at ${pct(cx)} ${pct(cy)}, ${on} ${Math.max(0, r-fr)}px, ${off} ${r}px)`;
    }
    case 'band': {
      const w = S.width, e = p*(1 + w + 2*f) - f;
      return `linear-gradient(${ANG[S.dir]}deg, ${off} ${pct(e-w-f)}, ${on} ${pct(e-w)}, ${on} ${pct(e)}, ${off} ${pct(e+f)})`;
    }
    case 'dots': {                                        // 도트가 자라며 덮는다 — dir 쪽부터 (오프셋과 지연)
      const cell = S.cell*k, st = clamp(S.stagger), R = cell*0.75; let s = '';
      for (let y = cell/2; y < H + cell; y += cell) for (let x = cell/2; x < W + cell; x += cell){
        const lp = clamp((p - st*alongDir(S, x, y, W, H)) / (1 - st + 1e-6)), e = EASE.out(lp);
        if (e > 0) s += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(e*R).toFixed(1)}"/>`;
      }
      return finish(blurDef, grp(s));
    }
    case 'slices': {                                      // 띠들이 시차를 두고 닦는다 — 8분할의 여덟 줄
      const n = Math.max(2, S.slices|0), st = clamp(S.stagger);
      const horiz = !(S.dir === 'down' || S.dir === 'up'); let s = '';
      const flip = d => ({ right:'left', left:'right', down:'up', up:'down' })[d] || 'left';
      for (let i = 0; i < n; i++){
        const lp = EASE.inout(clamp((p - st*i/(n-1)) / (1 - st + 1e-6)));
        const d = S.alternate && i % 2 ? flip(S.dir) : (horiz ? (S.dir === 'left' ? 'left' : 'right') : S.dir);
        if (horiz){ const h = H/n, w = W*lp; s += `<rect x="${d === 'left' ? W - w : 0}" y="${i*h}" width="${w}" height="${h + 1}"/>`; }
        else      { const w = W/n, h = H*lp; s += `<rect x="${i*w}" y="${d === 'up' ? H - h : 0}" width="${w + 1}" height="${h}"/>`; }
      }
      return finish(blurDef, grp(s));
    }
    case 'liquid': {                                      // 와이프 가장자리를 노이즈로 밀어 물처럼 (변형)
      const sc = S.scale*k, blur = (f*W*0.08).toFixed(1), L = Math.hypot(W, H);
      const [dx, dy] = VEC[S.dir] || VEC.right, h = (Math.abs(W*dx) + Math.abs(H*dy))/2;
      const e = p*(1 + f), edge = (-h - sc) + e*(2*h + 2*sc);
      const x0 = W/2 - h - sc - 4, x1 = W/2 + edge;
      const defs = `<filter id="lq" x="-30%" y="-30%" width="160%" height="160%"><feTurbulence type="fractalNoise" baseFrequency="${S.freq}" numOctaves="2" seed="${S.seed}" result="n"/><feGaussianBlur in="SourceGraphic" stdDeviation="${blur}" result="b"/><feDisplacementMap in="b" in2="n" scale="${sc.toFixed(1)}" xChannelSelector="R" yChannelSelector="G"/></filter>`;
      const shapes = `<g transform="rotate(${ANG[S.dir]-90} ${W/2} ${H/2})"><rect x="${x0.toFixed(1)}" y="${-L}" width="${Math.max(0, x1 - x0).toFixed(1)}" height="${3*L}" fill="#000" filter="url(#lq)"/></g>`;
      return finish(defs, shapes);
    }
    case 'shape': {                                       // 도형이 회전하며 이동해 커진다 — 창(매트) 또는 덮개(cover)
      const shp = S.shape || 'rect', ratio = S.ratio ?? 16/9, spin = S.spin ?? 720, D = Math.hypot(W, H);
      const [fx, fy] = S.from ?? [0.12, 0.88], [tx, ty] = S.to ?? [0.5, 0.5], [ex, ey] = S.exit ?? [0.88, 0.12];
      const full = shp === 'circle' ? D*1.02 : shp === 'rect' ? Math.max(W, H*ratio)*1.04 : D*1.25;
      const s0 = (S.size0 ?? 0.06)*D;
      let cx, cy, ang, size;
      if (!S.cover){ cx = W*(fx + (tx-fx)*p); cy = H*(fy + (ty-fy)*p); ang = spin*p; size = s0 + (full-s0)*p; }
      else if (p < 0.5){ const q = EASE.inout(p/0.5); cx = W*(fx + (tx-fx)*q); cy = H*(fy + (ty-fy)*q); ang = spin*0.5*q; size = s0 + (full-s0)*q; }
      else { const q = EASE.inout((p-0.5)/0.5); cx = W*(tx + (ex-tx)*q); cy = H*(ty + (ey-ty)*q); ang = spin*0.5*(1+q); size = full + (s0-full)*q; }
      const poly = n => `<polygon points="${Array.from({length:n}, (_, i) => { const a = -Math.PI/2 + i*2*Math.PI/n; return `${(0.5*Math.cos(a)).toFixed(4)},${(0.5*Math.sin(a)).toFixed(4)}`; }).join(' ')}"/>`;
      const geo = shp === 'circle' ? `<circle r="0.5"/>` : shp === 'rect' ? `<rect x="-0.5" y="${(-0.5/ratio).toFixed(4)}" width="1" height="${(1/ratio).toFixed(4)}" rx="${S.rx ?? 0.03}"/>` : shp === 'hex' ? poly(6) : poly(3);
      return finish(blurDef, grp(`<g transform="translate(${cx.toFixed(1)} ${cy.toFixed(1)}) rotate(${ang.toFixed(2)}) scale(${size.toFixed(1)})">${geo}</g>`));
    }
    case 'ink': {                                         // 노이즈 문턱값이 내려가며 번진다 — 종이 위 잉크
      const K = 4 + (1 - f)*56, th = 0.85 - p*0.9;
      const defs = `<filter id="ink" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="${S.freq}" numOctaves="3" seed="${S.seed}" result="n"/><feColorMatrix in="n" type="luminanceToAlpha" result="a"/><feComponentTransfer in="a" result="t"><feFuncA type="linear" slope="${K.toFixed(2)}" intercept="${(-K*th).toFixed(3)}"/></feComponentTransfer><feFlood flood-color="#000" result="f"/><feComposite in="f" in2="t" operator="in"/></filter>`;
      return finish(defs, `<rect width="${W}" height="${H}" fill="#000" filter="url(#ink)"/>`);
    }
    default: {                                            // wipe (대각선은 dir로)
      const e = p*(1+f);
      return `linear-gradient(${ANG[S.dir]}deg, ${on} ${pct(e-f)}, ${off} ${pct(e)})`;
    }
  }
}

function render(t){
  const p = EASE[S.ease](clamp(t / S.duration));
  const st = document.getElementById('stage'), fl = document.getElementById('fill');
  st.style.background = MATTE ? '#000' : 'transparent';
  fl.style.background = MATTE ? '#fff' : S.color;
  fl.style.opacity = MATTE ? 1 : S.opacity;
  const m = maskFor(S, p, innerWidth, innerHeight);
  fl.style.webkitMaskImage = m; fl.style.maskImage = m;
  fl.style.webkitMaskSize = fl.style.maskSize = '100% 100%';
}
render(parseFloat(q.get('t') || '0'));
</script>
