name: Deploy to Dev Server

on:
  push:
    branches:
      - main
      - agent
      - platform_admin
      - feature/notification-system

  workflow_dispatch:
    inputs:
      branch:
        description: '배포할 브랜치'
        required: true
        type: choice
        options:
          - main
          - agent
          - platform_admin
          - notification_system

env:
  DEV_DEPLOY_DIR: infra/dev

jobs:
  deploy:
    name: Deploy (${{ github.event.inputs.branch || github.ref_name }})
    runs-on: self-hosted
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve branch name
        id: branch
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW_NAME="${{ github.event.inputs.branch }}"
          else
            RAW_NAME="${GITHUB_REF_NAME}"
          fi

          # 브랜치명 → deploy.sh 키 변환 (feature/notification-system → notification_system)
          declare -A BRANCH_MAP=(
            ["feature/notification-system"]="notification_system"
          )
          DEPLOY_NAME="${BRANCH_MAP[$RAW_NAME]:-$RAW_NAME}"

          echo "NAME=${DEPLOY_NAME}" >> $GITHUB_OUTPUT

      - name: Deploy
        working-directory: ${{ env.DEV_DEPLOY_DIR }}
        run: |
          echo "========================================="
          echo "  브랜치: ${{ steps.branch.outputs.NAME }}"
          echo "  커밋:   ${GITHUB_SHA::8}"
          echo "  작성자: ${{ github.actor }}"
          echo "========================================="

          ./deploy.sh ${{ steps.branch.outputs.NAME }}

      - name: Verify deployment
        working-directory: ${{ env.DEV_DEPLOY_DIR }}
        run: |
          ./deploy.sh status

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::배포 실패 - 브랜치: ${{ steps.branch.outputs.NAME }}, 커밋: ${GITHUB_SHA::8}"
