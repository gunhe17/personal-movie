<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Document · Form 도메인 캔버스</title>
<style>
  :root {
    --bg: #0f1115;
    --grid: #1b1f27;
    --panel: #161a22;
    --panel-2: #1d222c;
    --border: #2a313d;
    --text: #e6e9ef;
    --muted: #8b93a3;
    --faint: #5b6473;

    --form: #6366f1;
    --form-soft: rgba(99, 102, 241, 0.12);
    --doc: #f97316;
    --doc-soft: rgba(249, 115, 22, 0.12);
    --map: #64748b;
    --map-soft: rgba(100, 116, 139, 0.10);

    --pk: #f5b324;
    --fk: #38bdf8;
    --uq: #c084fc;
    --idx: #34d399;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
      "Helvetica Neue", "Apple SD Gothic Neo", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- Top bar ---------- */
  .topbar {
    position: fixed; top: 0; left: 0; right: 0; height: 52px;
    display: flex; align-items: center; gap: 14px;
    padding: 0 16px; z-index: 50;
    background: rgba(17, 20, 27, 0.85);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
  }
  .brand { display: flex; align-items: center; gap: 9px; font-weight: 650; font-size: 14px; }
  .brand .dot { width: 9px; height: 9px; border-radius: 3px;
    background: linear-gradient(135deg, var(--form), var(--doc)); }
  .brand small { color: var(--muted); font-weight: 500; font-size: 11.5px; }

  .legend { display: flex; align-items: center; gap: 14px; margin-left: 6px; }
  .legend .chip { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--muted); }
  .legend .swatch { width: 11px; height: 11px; border-radius: 3px; }
  .legend .line { width: 18px; height: 0; border-top: 2px solid var(--map); }
  .legend .line.dashed { border-top-style: dashed; }

  .spacer { flex: 1; }

  .search {
    display: flex; align-items: center; gap: 6px;
    background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 8px; padding: 6px 10px;
  }
  .search input {
    background: transparent; border: none; outline: none; color: var(--text);
    font-size: 12.5px; width: 150px;
  }
  .search svg { color: var(--faint); }

  .btns { display: flex; gap: 6px; align-items: center; }
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    height: 32px; padding: 0 11px;
    background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 8px; color: var(--text); font-size: 12.5px;
    cursor: pointer; user-select: none; transition: 0.12s;
  }
  .btn:hover { background: #232a36; border-color: #3a4350; }
  .btn.toggle.on { background: var(--form-soft); border-color: var(--form); color: #c7c9ff; }
  .btn.icon { width: 32px; padding: 0; justify-content: center; font-size: 15px; }

  /* ---------- Canvas ---------- */
  #viewport {
    position: fixed; inset: 52px 0 0 0;
    overflow: hidden; cursor: grab;
    background-color: var(--bg);
    background-image:
      radial-gradient(circle at 1px 1px, var(--grid) 1px, transparent 0);
    background-size: 24px 24px;
  }
  #viewport.panning { cursor: grabbing; }

  #world { position: absolute; top: 0; left: 0; transform-origin: 0 0; }

  svg.edges { position: absolute; top: 0; left: 0; overflow: visible; pointer-events: none; }
  svg.edges path { fill: none; transition: opacity 0.15s, stroke 0.15s; }
  svg.edges path.logical { stroke: #5b6473; stroke-width: 1.6; }
  svg.edges path.proposed { stroke: #4a525f; stroke-width: 1.5; stroke-dasharray: 5 5; }
  svg.edges path.active { stroke: var(--fk); stroke-width: 2.4; }
  svg.edges path.dim { opacity: 0.12; }

  /* ---------- Frames (Figma-like) ---------- */
  .frame {
    position: absolute; border-radius: 16px;
    border: 1px solid var(--border);
    background: var(--map-soft);
  }
  .frame.form { background: var(--form-soft); border-color: rgba(99,102,241,0.35); }
  .frame.doc  { background: var(--doc-soft);  border-color: rgba(249,115,22,0.35); }
  .frame .frame-label {
    position: absolute; top: -11px; left: 16px;
    font-size: 12px; font-weight: 650; letter-spacing: 0.2px;
    padding: 2px 10px; border-radius: 8px;
    background: var(--panel); border: 1px solid var(--border);
  }
  .frame.form .frame-label { color: #c7c9ff; border-color: rgba(99,102,241,0.5); }
  .frame.doc  .frame-label { color: #ffd2ad; border-color: rgba(249,115,22,0.5); }
  .frame.map  .frame-label { color: #c3cbd8; }
  .frame .frame-sub { font-weight: 500; color: var(--muted); font-size: 11px; }

  /* ---------- Table card ---------- */
  .card {
    position: absolute; width: 256px;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 12px; overflow: hidden;
    box-shadow: 0 8px 24px rgba(0,0,0,0.35);
    transition: box-shadow 0.15s, opacity 0.15s, border-color 0.15s;
  }
  .card.dim { opacity: 0.28; }
  .card.hl { border-color: var(--fk); box-shadow: 0 0 0 2px rgba(56,189,248,0.5), 0 10px 28px rgba(0,0,0,0.5); }
  .card .head {
    display: flex; align-items: center; gap: 8px;
    height: 44px; padding: 0 12px; cursor: grab;
    border-bottom: 1px solid var(--border);
    position: relative;
  }
  .card .head::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
  }
  .card.form .head::before { background: var(--form); }
  .card.doc  .head::before { background: var(--doc); }
  .card.map  .head::before { background: var(--map); }
  .card .head .tname { font-weight: 650; font-size: 13px; letter-spacing: 0.1px; }
  .card .head .tag {
    margin-left: auto; font-size: 9.5px; font-weight: 650; letter-spacing: 0.4px;
    text-transform: uppercase; padding: 2px 6px; border-radius: 5px;
  }
  .card.form .head .tag { background: var(--form-soft); color: #aeb0ff; }
  .card.doc  .head .tag { background: var(--doc-soft);  color: #ffba85; }
  .card.map  .head .tag { background: var(--map-soft);  color: #aab4c2; }

  .card .rows { padding: 4px 0; }
  .row {
    display: flex; align-items: center; gap: 6px;
    height: 25px; padding: 0 12px; font-size: 11.5px;
  }
  .row:hover { background: var(--panel-2); }
  .row .fname { color: var(--text); white-space: nowrap; }
  .row.audit .fname { color: var(--faint); }
  .row .ftype { margin-left: auto; color: var(--muted); font-size: 10.5px;
    font-family: "SF Mono", "JetBrains Mono", ui-monospace, monospace; white-space: nowrap; }
  .row .badge {
    font-size: 8.5px; font-weight: 700; letter-spacing: 0.3px;
    padding: 1px 4px; border-radius: 4px; line-height: 1.4;
  }
  .b-pk  { background: rgba(245,179,36,0.16); color: var(--pk); }
  .b-fk  { background: rgba(56,189,248,0.16); color: var(--fk); }
  .b-uq  { background: rgba(192,132,252,0.16); color: var(--uq); }
  .b-idx { background: rgba(52,211,153,0.14); color: var(--idx); }
  .b-n   { color: var(--faint); border: 1px solid var(--border); }
  .b-ext { background: rgba(100,116,139,0.18); color: #9aa6b5; }
  .fk-target { color: var(--fk); font-size: 9.5px; opacity: 0.8; }

  .card .foot {
    padding: 6px 12px; font-size: 10px; color: var(--faint);
    border-top: 1px solid var(--border); line-height: 1.5;
  }

  /* zoom badge */
  .zoombadge {
    position: fixed; bottom: 16px; right: 16px; z-index: 40;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 8px; padding: 6px 10px; font-size: 12px; color: var(--muted);
    display: flex; gap: 8px; align-items: center;
  }
  .hint {
    position: fixed; bottom: 16px; left: 16px; z-index: 40;
    font-size: 11.5px; color: var(--faint);
  }
  kbd {
    font-family: inherit; background: var(--panel-2); border: 1px solid var(--border);
    border-bottom-width: 2px; border-radius: 5px; padding: 1px 5px; font-size: 10.5px; color: var(--muted);
  }
</style>
</head>
<body>
  <div class="topbar">
    <div class="brand">
      <span class="dot"></span>
      Document · Form 도메인 <small>스키마 캔버스</small>
    </div>
    <div class="legend">
      <span class="chip"><span class="swatch" style="background:var(--form)"></span>Form</span>
      <span class="chip"><span class="swatch" style="background:var(--doc)"></span>Document</span>
      <span class="chip"><span class="swatch" style="background:var(--map)"></span>매핑(설계)</span>
      <span class="chip"><span class="line"></span>논리 참조</span>
      <span class="chip"><span class="line dashed"></span>미구현</span>
    </div>
    <div class="spacer"></div>
    <div class="search">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="search" placeholder="테이블 검색…" />
    </div>
    <div class="btns">
      <div class="btn toggle on" id="t-audit">audit 필드</div>
      <div class="btn toggle on" id="t-map">매핑 테이블</div>
      <div class="btn icon" id="z-out">−</div>
      <div class="btn icon" id="z-in">＋</div>
      <div class="btn" id="z-fit">맞춤</div>
    </div>
  </div>

  <div id="viewport">
    <div id="world">
      <svg class="edges" id="edges" width="2400" height="1500"></svg>
    </div>
  </div>

  <div class="zoombadge"><span id="zoomval">100%</span></div>
  <div class="hint">드래그 <kbd>빈 공간</kbd> 이동 · <kbd>헤더</kbd> 카드 이동 · <kbd>휠</kbd> 줌 · 카드 hover 시 관계 강조</div>

<script>
/* =========================================================================
   DATA — apps/api/app/modules/{document,form} 실제 모델 기준
   BaseModel 상속: id(UUID PK), created_at, updated_at, deleted_at
   FK 제약 없음 → 모든 참조는 application-level 논리 참조
   ========================================================================= */
const PK   = { pk: true };
const A    = { audit: true };           // BaseModel audit 필드
const NUL  = { nullable: true };

function f(name, type, opts = {}) { return { name, type, ...opts }; }

const TABLES = {
  /* ---------------- Form 도메인 ---------------- */
  form_templates: {
    domain: 'form', x: 60, y: 92,
    note: 'center_id NULL = 시스템 템플릿 · immutable 버전(수정 시 새 row)',
    fields: [
      f('id', 'UUID', PK),
      f('center_id', 'String(36)', { nullable: true, note: 'NULL=시스템' }),
      f('name', 'String(100)'),
      f('version', 'Integer', { def: '1' }),
      f('schema', 'JSONB', { json: true }),
      f('is_active', 'Boolean', { def: 'true' }),
      f('created_at', 'DateTime', A),
      f('updated_at', 'DateTime', A),
      f('deleted_at', 'DateTime', { ...A, nullable: true }),
    ],
    uniq: 'UNIQUE (center_id, name, version)',
  },
  form_instances: {
    domain: 'form', x: 392, y: 150,
    note: '작성 단위 · 특정 template 버전 참조 · draft ↔ submitted',
    fields: [
      f('id', 'UUID', PK),
      f('center_id', 'String(36)'),
      f('template_id', 'String(36)', { idx: true, fk: 'form_templates' }),
      f('status', 'String(20)', { def: "'draft'" }),
      f('submitted_at', 'DateTime', NUL),
      f('created_at', 'DateTime', A),
      f('updated_at', 'DateTime', A),
      f('deleted_at', 'DateTime', { ...A, nullable: true }),
    ],
  },
  form_answers: {
    domain: 'form', x: 724, y: 92,
    note: 'row-per-answer · UPSERT(instance_id, question_id)',
    fields: [
      f('id', 'UUID', PK),
      f('center_id', 'String(36)', { idx: true }),
      f('instance_id', 'String(36)', { idx: true, fk: 'form_instances' }),
      f('question_id', 'String(100)'),
      f('answer', 'JSONB', { json: true }),
      f('created_at', 'DateTime', A),
      f('updated_at', 'DateTime', A),
      f('deleted_at', 'DateTime', { ...A, nullable: true }),
    ],
    uniq: 'UNIQUE (instance_id, question_id)',
  },
  form_signatures: {
    domain: 'form', x: 724, y: 392,
    note: '전자 서명 · Immutable · 최신 signed_at이 유효',
    fields: [
      f('id', 'UUID', PK),
      f('center_id', 'String(36)', { idx: true }),
      f('instance_id', 'String(36)', { idx: true, fk: 'form_instances' }),
      f('field_id', 'String(100)'),
      f('storage_type', 'String(20)', { def: "'base64'" }),
      f('signature_data', 'Text', NUL),
      f('storage_path', 'String(500)', NUL),
      f('signer_name', 'String(100)'),
      f('signer_ip', 'String(45)', NUL),
      f('signed_at', 'DateTime'),
      f('created_at', 'DateTime', A),
      f('updated_at', 'DateTime', A),
      f('deleted_at', 'DateTime', { ...A, nullable: true }),
    ],
  },

  /* ---------------- Document 도메인 ---------------- */
  documents: {
    domain: 'doc', x: 1064, y: 150,
    note: 'S3 Native · 버전관리는 S3 Versioning · storage_path 고정',
    fields: [
      f('id', 'UUID', PK),
      f('center_id', 'String(36)', { idx: true }),
      f('uploader_id', 'String(36)', { idx: true }),
      f('name', 'String(255)'),
      f('original_name', 'String(255)', NUL),
      f('description', 'Text', NUL),
      f('storage_path', 'String(512)', { uniq: true }),
      f('file_type', 'String(100)'),
      f('file_size', 'BigInteger'),
      f('checksum', 'String(64)'),
      f('access_level', 'String(20)', { def: "'center'" }),
      f('deleted_at', 'DateTime', { nullable: true, idx: true }),
      f('created_at', 'DateTime', A),
      f('updated_at', 'DateTime', A),
    ],
  },
  document_accesses: {
    domain: 'doc', x: 1396, y: 92,
    note: '접근 감사 로그 (download/delete/restore/share)',
    fields: [
      f('id', 'UUID', PK),
      f('document_id', 'String(36)', { idx: true, fk: 'documents' }),
      f('s3_version_id', 'String(100)', NUL),
      f('account_id', 'String(36)', { ...NUL, idx: true }),
      f('action', 'String(20)'),
      f('ip_address', 'String(45)', NUL),
      f('user_agent', 'Text', NUL),
      f('accessed_at', 'DateTime'),
      f('created_at', 'DateTime', A),
      f('updated_at', 'DateTime', A),
      f('deleted_at', 'DateTime', { ...A, nullable: true }),
    ],
  },
  share_tokens: {
    domain: 'doc', x: 1396, y: 452,
    note: '외부 공유 토큰 (만료 / 다운로드 제한 / 비밀번호)',
    fields: [
      f('id', 'UUID', PK),
      f('token', 'String(64)', { uniq: true, idx: true }),
      f('document_id', 'String(36)', { idx: true, fk: 'documents' }),
      f('created_by', 'String(36)'),
      f('expires_at', 'DateTime', { idx: true }),
      f('max_downloads', 'Integer', NUL),
      f('download_count', 'Integer', { def: '0' }),
      f('password_hash', 'String(255)', NUL),
      f('created_at', 'DateTime', A),
      f('updated_at', 'DateTime', A),
      f('deleted_at', 'DateTime', { ...A, nullable: true }),
    ],
  },

  /* ---------------- 매핑 테이블 (설계 문서 · 미구현) ---------------- */
  client_form_instances: {
    domain: 'map', proposed: true, x: 60, y: 920,
    note: 'Client ↔ Form (application/consent/initial_interview)',
    fields: [
      f('id', 'UUID', PK),
      f('client_id', 'UUID', { ext: 'client' }),
      f('instance_id', 'UUID', { fk: 'form_instances' }),
      f('relation_type', 'String(50)'),
      f('created_at', 'DateTime'),
    ],
    uniq: 'UNIQUE (client_id, instance_id)',
  },
  counseling_form_instances: {
    domain: 'map', proposed: true, x: 392, y: 920,
    note: 'Counseling ↔ Form (contract/termination_report)',
    fields: [
      f('id', 'UUID', PK),
      f('counseling_session_id', 'UUID', { ext: 'counseling' }),
      f('instance_id', 'UUID', { fk: 'form_instances' }),
      f('relation_type', 'String(50)'),
      f('created_at', 'DateTime'),
    ],
  },
  document_form_instances: {
    domain: 'map', proposed: true, x: 724, y: 920,
    note: 'PDF export 연계 · 1:1 (instance당 1 document)',
    fields: [
      f('id', 'UUID', PK),
      f('document_id', 'UUID', { fk: 'documents' }),
      f('instance_id', 'UUID', { fk: 'form_instances' }),
      f('created_at', 'DateTime'),
    ],
    uniq: 'UNIQUE (instance_id)',
  },
  client_documents: {
    domain: 'map', proposed: true, x: 1064, y: 920,
    note: 'Client ↔ Document (consent_form/contract/…)',
    fields: [
      f('id', 'UUID', PK),
      f('client_id', 'UUID', { ext: 'client' }),
      f('document_id', 'UUID', { fk: 'documents' }),
      f('relation_type', 'String(50)'),
      f('created_at', 'DateTime'),
    ],
    uniq: 'UNIQUE (client_id, document_id)',
  },
  counseling_session_documents: {
    domain: 'map', proposed: true, x: 1396, y: 920,
    note: 'CounselingSession ↔ Document (note/homework/report)',
    fields: [
      f('id', 'UUID', PK),
      f('session_id', 'UUID', { ext: 'counseling' }),
      f('document_id', 'UUID', { fk: 'documents' }),
      f('relation_type', 'String(50)'),
      f('created_at', 'DateTime'),
    ],
  },
  assessment_documents: {
    domain: 'map', proposed: true, x: 1064, y: 1130,
    note: 'Assessment ↔ Document (test_sheet/result_report/…)',
    fields: [
      f('id', 'UUID', PK),
      f('assessment_id', 'UUID', { ext: 'assessment' }),
      f('document_id', 'UUID', { fk: 'documents' }),
      f('relation_type', 'String(50)'),
      f('created_at', 'DateTime'),
    ],
  },
};

const FRAMES = [
  { cls: 'form', label: 'Form 도메인', sub: '· 구현됨 (4 tables)', x: 20, y: 24, w: 944, h: 760 },
  { cls: 'doc',  label: 'Document 도메인', sub: '· 구현됨 (3 tables)', x: 1000, y: 24, w: 664, h: 760 },
  { cls: 'map',  label: '매핑 테이블', sub: '· 설계 문서 기준 (미구현, 6 tables)', x: 20, y: 832, w: 1644, h: 432 },
];

// edges: from "table.field" → to table  (kind inferred from proposed flag)
const EDGES = [];
for (const [tname, t] of Object.entries(TABLES)) {
  for (const fld of t.fields) {
    if (fld.fk) {
      EDGES.push({
        fromTable: tname, fromField: fld.name, toTable: fld.fk,
        kind: t.proposed ? 'proposed' : 'logical',
      });
    }
  }
}

/* ====================== RENDER ====================== */
const HEADER_H = 44, ROW_H = 25, ROWS_PAD = 4, CARD_W = 256;
const world = document.getElementById('world');
const svg = document.getElementById('edges');
const viewport = document.getElementById('viewport');

let showAudit = true, showMap = true;

function visibleFields(t) {
  return t.fields.filter(f => showAudit || !f.audit);
}
function cardHeight(t) {
  const n = visibleFields(t).length;
  return HEADER_H + ROWS_PAD * 2 + n * ROW_H + (t.uniq ? 24 : 0);
}

function buildCards() {
  // remove old cards & frames (keep svg)
  world.querySelectorAll('.card, .frame').forEach(el => el.remove());

  // frames
  for (const fr of FRAMES) {
    if (fr.cls === 'map' && !showMap) continue;
    const d = document.createElement('div');
    d.className = 'frame ' + fr.cls;
    d.style.left = fr.x + 'px'; d.style.top = fr.y + 'px';
    d.style.width = fr.w + 'px'; d.style.height = fr.h + 'px';
    d.innerHTML = `<div class="frame-label">${fr.label} <span class="frame-sub">${fr.sub}</span></div>`;
    world.appendChild(d);
  }

  // cards
  for (const [tname, t] of Object.entries(TABLES)) {
    if (t.proposed && !showMap) continue;
    const card = document.createElement('div');
    card.className = 'card ' + t.domain;
    card.dataset.table = tname;
    card.style.left = t.x + 'px';
    card.style.top = t.y + 'px';
    card.style.width = CARD_W + 'px';

    const tagText = t.proposed ? 'PROPOSED' : t.domain;
    let rows = '';
    for (const fld of visibleFields(t)) {
      let badges = '';
      if (fld.pk) badges += `<span class="badge b-pk">PK</span>`;
      if (fld.fk) badges += `<span class="badge b-fk">FK</span>`;
      if (fld.uniq) badges += `<span class="badge b-uq">UQ</span>`;
      if (fld.idx) badges += `<span class="badge b-idx">IDX</span>`;
      if (fld.ext) badges += `<span class="badge b-ext">→${fld.ext}</span>`;
      if (fld.nullable) badges += `<span class="badge b-n">N</span>`;
      const def = fld.def ? ` = ${fld.def}` : '';
      rows += `<div class="row ${fld.audit ? 'audit' : ''}" data-field="${fld.name}">
        <span class="fname">${fld.name}</span>${badges}
        <span class="ftype">${fld.type}${def}</span>
      </div>`;
    }
    card.innerHTML = `
      <div class="head">
        <span class="tname">${tname}</span>
        <span class="tag">${tagText}</span>
      </div>
      <div class="rows">${rows}</div>
      ${t.uniq ? `<div class="foot">${t.uniq}</div>` : ''}
    `;
    world.appendChild(card);
  }
}

/* ----- edge geometry (analytic, world coords) ----- */
function fieldRowCenterY(tname, fieldName) {
  const t = TABLES[tname];
  const vis = visibleFields(t);
  const idx = vis.findIndex(f => f.name === fieldName);
  return t.y + HEADER_H + ROWS_PAD + (idx < 0 ? 0 : idx) * ROW_H + ROW_H / 2;
}
function headerCenterY(tname) { return TABLES[tname].y + HEADER_H / 2; }

function edgePath(e) {
  const src = TABLES[e.fromTable], dst = TABLES[e.toTable];
  const srcCY = fieldRowCenterY(e.fromTable, e.fromField);
  const dstCY = headerCenterY(e.toTable);
  const srcCx = src.x + CARD_W / 2, dstCx = dst.x + CARD_W / 2;
  const srcRight = srcCx <= dstCx;
  const sx = srcRight ? src.x + CARD_W : src.x;
  const dstLeft = dst.x + CARD_W / 2 >= src.x + CARD_W / 2;
  const dx = dstLeft ? dst.x : dst.x + CARD_W;
  const sy = srcCY, dy = dstCY;
  const dist = Math.max(40, Math.abs(dx - sx) * 0.45);
  const c1x = sx + (srcRight ? dist : -dist);
  const c2x = dx + (dstLeft ? -dist : dist);
  return `M ${sx} ${sy} C ${c1x} ${sy}, ${c2x} ${dy}, ${dx} ${dy}`;
}

function drawEdges() {
  svg.innerHTML = '';
  for (const e of EDGES) {
    if ((TABLES[e.fromTable].proposed || TABLES[e.toTable].proposed) && !showMap) continue;
    const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    p.setAttribute('d', edgePath(e));
    p.setAttribute('class', e.kind);
    p.dataset.from = e.fromTable; p.dataset.to = e.toTable;
    svg.appendChild(p);
  }
}

/* ====================== VIEW TRANSFORM ====================== */
let zoom = 1, panX = 40, panY = 30;
function applyTransform() {
  world.style.transform = `translate(${panX}px, ${panY}px) scale(${zoom})`;
  document.getElementById('zoomval').textContent = Math.round(zoom * 100) + '%';
}

viewport.addEventListener('wheel', (e) => {
  e.preventDefault();
  const rect = viewport.getBoundingClientRect();
  const cx = e.clientX - rect.left, cy = e.clientY - rect.top;
  const wx = (cx - panX) / zoom, wy = (cy - panY) / zoom;
  const factor = e.deltaY < 0 ? 1.1 : 1 / 1.1;
  zoom = Math.min(2.4, Math.max(0.25, zoom * factor));
  panX = cx - wx * zoom; panY = cy - wy * zoom;
  applyTransform();
}, { passive: false });

/* ----- drag: pan vs card ----- */
let dragMode = null, dragTable = null, startMouse = null, startVal = null;

viewport.addEventListener('mousedown', (e) => {
  const head = e.target.closest('.card .head');
  if (head) {
    const card = head.closest('.card');
    dragMode = 'card';
    dragTable = card.dataset.table;
    startMouse = { x: e.clientX, y: e.clientY };
    startVal = { x: TABLES[dragTable].x, y: TABLES[dragTable].y };
    card.classList.add('hl');
  } else {
    dragMode = 'pan';
    startMouse = { x: e.clientX, y: e.clientY };
    startVal = { x: panX, y: panY };
    viewport.classList.add('panning');
  }
});

window.addEventListener('mousemove', (e) => {
  if (!dragMode) return;
  const dx = e.clientX - startMouse.x, dy = e.clientY - startMouse.y;
  if (dragMode === 'pan') {
    panX = startVal.x + dx; panY = startVal.y + dy;
    applyTransform();
  } else {
    const t = TABLES[dragTable];
    t.x = startVal.x + dx / zoom;
    t.y = startVal.y + dy / zoom;
    const card = world.querySelector(`.card[data-table="${dragTable}"]`);
    card.style.left = t.x + 'px'; card.style.top = t.y + 'px';
    drawEdges();
  }
});

window.addEventListener('mouseup', () => {
  if (dragMode === 'card') {
    const card = world.querySelector(`.card[data-table="${dragTable}"]`);
    if (card && !card.matches(':hover')) card.classList.remove('hl');
  }
  dragMode = null; dragTable = null;
  viewport.classList.remove('panning');
});

/* ----- hover highlight (relations) ----- */
world.addEventListener('mouseover', (e) => {
  const card = e.target.closest('.card');
  if (!card || dragMode) return;
  const name = card.dataset.table;
  const connected = new Set([name]);
  EDGES.forEach(ed => {
    if (ed.fromTable === name) connected.add(ed.toTable);
    if (ed.toTable === name) connected.add(ed.fromTable);
  });
  world.querySelectorAll('.card').forEach(c =>
    c.classList.toggle('dim', !connected.has(c.dataset.table)));
  svg.querySelectorAll('path').forEach(p => {
    const on = p.dataset.from === name || p.dataset.to === name;
    p.classList.toggle('active', on);
    p.classList.toggle('dim', !on);
  });
});
world.addEventListener('mouseout', (e) => {
  if (e.target.closest('.card') && !e.relatedTarget?.closest?.('.card')) {
    world.querySelectorAll('.card').forEach(c => c.classList.remove('dim'));
    svg.querySelectorAll('path').forEach(p => p.classList.remove('active', 'dim'));
  }
});

/* ====================== CONTROLS ====================== */
function zoomBy(factor) {
  const rect = viewport.getBoundingClientRect();
  const cx = rect.width / 2, cy = rect.height / 2;
  const wx = (cx - panX) / zoom, wy = (cy - panY) / zoom;
  zoom = Math.min(2.4, Math.max(0.25, zoom * factor));
  panX = cx - wx * zoom; panY = cy - wy * zoom;
  applyTransform();
}
document.getElementById('z-in').onclick = () => zoomBy(1.2);
document.getElementById('z-out').onclick = () => zoomBy(1 / 1.2);
document.getElementById('z-fit').onclick = fitToScreen;

function contentBounds() {
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for (const [tname, t] of Object.entries(TABLES)) {
    if (t.proposed && !showMap) continue;
    minX = Math.min(minX, t.x); minY = Math.min(minY, t.y);
    maxX = Math.max(maxX, t.x + CARD_W); maxY = Math.max(maxY, t.y + cardHeight(t));
  }
  return { minX, minY, maxX, maxY };
}
function fitToScreen() {
  const b = contentBounds();
  const pad = 60;
  const rect = viewport.getBoundingClientRect();
  const cw = b.maxX - b.minX + pad * 2, ch = b.maxY - b.minY + pad * 2;
  zoom = Math.min(2.4, Math.max(0.25, Math.min(rect.width / cw, rect.height / ch)));
  panX = (rect.width - (b.maxX - b.minX) * zoom) / 2 - (b.minX - pad) * zoom + pad * zoom;
  panX = rect.width / 2 - ((b.minX + b.maxX) / 2) * zoom;
  panY = rect.height / 2 - ((b.minY + b.maxY) / 2) * zoom;
  applyTransform();
}

document.getElementById('t-audit').onclick = (e) => {
  showAudit = !showAudit;
  e.currentTarget.classList.toggle('on', showAudit);
  buildCards(); drawEdges();
};
document.getElementById('t-map').onclick = (e) => {
  showMap = !showMap;
  e.currentTarget.classList.toggle('on', showMap);
  buildCards(); drawEdges();
};

document.getElementById('search').addEventListener('input', (e) => {
  const q = e.target.value.trim().toLowerCase();
  world.querySelectorAll('.card').forEach(c => {
    const match = !q || c.dataset.table.toLowerCase().includes(q);
    c.classList.toggle('dim', q && !match);
    c.classList.toggle('hl', q && match);
  });
});

/* ====================== INIT ====================== */
buildCards();
drawEdges();
applyTransform();
fitToScreen();
window.addEventListener('resize', fitToScreen);
</script>
</body>
</html>
