<script type="text/plain" id="doc-readme">
# 마인드엔서 — 내담자 앱 기능 명세

> 상담센터 내담자/보호자를 위한 모바일 앱
> 최종 수정: 2026-05-20

---

## 제품 정의

**한 줄 요약**: 상담 일정 확인 + 진행현황 추적 + 검사 결과 열람 + 성장 콘텐츠 앱

**타겟 사용자**:

| 사용자 | 핵심 질문 |
|---|---|
| 성인 내담자 | "다음에 뭘 하면 되지?" |
| 아동 보호자 | "우리 애 어디까지 했지?" |

- 아동이 직접 사용하는 케이스는 없음
- 성인 내담자와 보호자의 앱 경험은 **동일** (별도 역할 선택/분기 없음)

---

## 앱 구조

**2탭 (홈 + 마이)**. 일정/진행현황/콘텐츠는 하나의 흐름이므로 분리하지 않음.

```
홈: 캐릭터 멘트 → 일정 카드 → 콘텐츠
마이: 센터별 정보 → 프로필 → 설정
```

상세 화면은 홈에서 드릴다운 (탭 분리가 아닌 터치 진입).

---

## 기능 목록

| # | 기능 | Phase | 설명 |
|---|---|---|---|
| F01 | 인증 & 온보딩 | MVP | 소셜 로그인, SMS 인증, 온보딩, 센터 연결 |
| F02 | 홈 화면 | MVP | 상태별 화면 (소속/미소속/대기), 조건부 표시 |
| F03 | 일정 & 타임라인 | MVP | 일정 카드, 타임라인 드릴다운, 진행현황 |
| F04 | 검사 결과 | MVP | 결과 열람, 종합 보고서, 공개 범위 |
| F05 | 자가진단 | MVP | 미소속 체험 콘텐츠 (일회성) |
| F06 | 콘텐츠 | MVP | 태그 기반 맞춤 추천 |
| F07 | 알림 | MVP | 푸시 알림 (FCM) |
| F08 | 마이페이지 | MVP | 센터 카드, 프로필, 자녀 정보, 설정 |
| F09 | 오브 캐릭터 | MVP | 멘트, 시각 변화, 에러/빈 상태 표현 |
| F10 | 미션 & 기록 | Phase 2 | 상담사 미션, 일상 기록, 상담사 전달 |
| F11 | 전문가 노트 | Phase 2 | 회기별 요약 노트, 발행 기반 공개 |
| F12 | AI 성장 가이드 | Phase 3 | AI 인사이트, 퀘스트, 성장 리포트 |

---

## 기술 스택

| 항목 | 결정 |
|---|---|
| 프레임워크 | React Native Expo (전문가 앱과 동일) |
| 레포 위치 | `apps/mobile-client/` (모노레포) |
| 애니메이션 | react-native-reanimated + @shopify/react-native-skia (오브) |
| 인증 | Account/Person 기존 구조 재사용 |
| 푸시 알림 | FCM (전문가 앱과 동일 인프라) |
| 분석 | Firebase Analytics |
| 다크 모드 | Expo 내장 지원, MVP 포함 |
| 오프라인 | MVP는 온라인 전용 |
| 앱 업데이트 | 스토어 업데이트만 (OTA 미사용) |

| 다른 내담자 정보 | **X** | 개인정보 보호 |

# 마인드엔서 — 설계 원칙

> 기존 기획서의 가정을 제1원칙으로 재검토한 결과

---

## 1. 해체된 가정

| 기존 가정 | 결론 |
|---|---|
| 앱이니까 하단 4탭이 필요하다 | 핵심 정보는 하나의 흐름 → 2탭(홈+마이)으로 충분 |
| 홈/일정/기록/마이 구조가 표준이다 | "언제 가지 → 뭘 하지 → 뭐 했대 → 어디쯤이지"는 분리할 이유 없음 |
| 미소속 유저에게도 풍부한 화면이 필요하다 | 핵심 가치는 센터 연결 후. 미소속 화면은 최소한으로 |
| 대시보드가 필요하다 | 사용자가 원하는 건 "다음에 뭘 하면 되지?"에 대한 답 |

---

## 2. 핵심 결정

### 사용자 경험은 동일하다

성인 내담자와 보호자의 앱 경험은 같다. 별도 역할 선택, 분기된 화면 없음. 다중 자녀/다중 센터 모두 통합 표시 (전환 없음).

### 정보 우선순위

앱을 열었을 때 위에서 아래로:

| 순위 | 정보 | 사용자 질문 |
|---|---|---|
| 1 | 캐릭터 멘트 | — (감성적 첫인상) |
| 2 | 다음 일정 (진행 바 포함) | "언제 가지? 어디쯤이지?" |
| 3 | 미션/성장 가이드 (Phase 2) | "그때까지 뭘 하지?" |
| 4 | 콘텐츠 | — (태그 기반 맞춤 추천) |

### 다중 센터/자녀 통합

사용자는 센터 단위로 생각하지 않는다. "이번 주에 뭐가 있지?"로 생각한다.

| 영역 | 통합 방식 |
|---|---|
| 일정 | 전체 시간순 합산 (자녀 이름 + 센터명 라벨) |
| 진행현황 | 자녀별 분리 (치료 맥락이 다르므로) |
| 콘텐츠 | 통합 (태그 기반 매칭) |

---

## 3. 디자인 방향

### 키워드

풍부한 콘텐츠 + 시각적 화려함 + 재미 요소 + 높은 직관성. 단순한 관리 도구가 아닌, 열 때마다 눈이 가고 손이 가는 앱.

### 적용 요소

| 요소 | 적용 | 비고 |
|---|---|---|
| 캐릭터 (오브) | 전체 | 가이드형, Phase 2에서 AI 연결 |
| 마이크로 인터랙션 | 전체 기본 | 진행 바 애니메이션, 카드 전환, 숫자 카운트업 |
| 감성 비주얼 | 포인트만 | 시간대별 톤 변화 (홈 상단), 계절감 |
| 게이미피케이션 | 제외 | 상담 맥락에서 배지/레벨은 부자연스러움 |

### 다크 모드

MVP 포함. 오브 캐릭터가 빛 기반이라 다크 모드에서 시너지.

- 라이트: 밝은 배경 + 은은한 오브 → 차분하고 깨끗한 느낌
- 다크: 어두운 배경 + 빛나는 오브 → 몰입감, 감성적

### 접근성

| 항목 | 결정 |
|---|---|
| 폰트 크기 | 시스템 설정 따름 + 최대 상한선 (레이아웃 보호) |
| 한 손 조작 | 주요 액션 버튼 하단 배치 |
| 인지 부하 | 최소화 (우울/불안 상태 내담자 고려) |

### 브랜드 톤

| 원칙 | 설명 |
|---|---|
| 심리센터 앱처럼 보이지 않게 | 건강관리/일정 앱 느낌 |
| 정보 위계는 타이포그래피로 | 크기/굵기/여백으로 구분 (색상 장식 아닌) |

### 피해야 할 것

"상담", "심리", "내담자" 워딩 직접 노출 / 파스텔 보라/핑크 색상 / 의미 없는 그라데이션/장식

---

## 4. 사용자 심리 특성

### 보호자

| 특성 | 양상 |
|---|---|
| 높은 불안 | 치료 효과를 지속적으로 의심. 아이 문제 인식에서 오는 죄책감 |
| 불확실성 민감 | 상담 내용을 알 수 없는 상황에서 오는 불안 |
| 과도한 책임감 | "내가 더 잘해야 한다"는 압박감 |
| 변화에 예민 | 작은 변화도 의미 부여. 나아지고 있다는 확신 필요 |

### 성인 내담자

| 특성 | 양상 |
|---|---|
| 진전 감각 갈망 | 변화가 눈에 보이는 증거 필요 |
| 자기 관리 의지 | 상담 외 일상에서 실천하고 싶지만 방법 모름 |
| 프라이버시 민감 | 심리 관련 앱이 타인에게 보이는 것에 대한 거부감 |

### UX 방향성

| 원칙 | 적용 |
|---|---|
| 부담 최소화 | 짧고 단계적 기록, 긴 입력 폼 대신 선택 → 텍스트 |
| 성취감 강화 | 기록 완료 시 즉각적 피드백 |
| 전문가 권위 활용 | 상담사 이름과 노트 전면 배치 |
| 변화 가시화 | 타임라인, 진행 표시 등 진행이 보이는 구조 |
</script>

<script type="text/plain" id="doc-f01">
# F01. 인증 & 온보딩

> 앱 설치부터 센터 연결까지의 전체 플로우

**Phase**: MVP

---

## 유저 스토리

- 사용자로서, 카카오/네이버/애플 계정으로 간편하게 가입하고 싶다
- 사용자로서, 센터에서 받은 코드를 입력해 센터와 연결하고 싶다
- 센터(상담사)로서, 승인 요청을 확인하고 내담자/보호자 역할을 지정해서 승인하고 싶다

---

## 1. 온보딩 슬라이드

### 정상 흐름

1. 앱을 처음 설치하고 연다
2. 온보딩 슬라이드 3장이 표시된다
3. 좌우 스와이프로 넘긴다
4. 3번째 슬라이드에서 "센터 코드 입력하기" 또는 "나중에 할게요" 중 선택한다

```
[1/3]  나를 위한 작은 변화의 시작 / 일정, 진행현황을 한눈에 확인하세요
[2/3]  센터와 연결하면 / 상담 일정 알림, 검사 결과까지
[3/3]  센터 코드가 있으신가요? / [센터 코드 입력하기] [나중에 할게요 →]
```

### 예외

- **이미 본 사용자가 다시 접속하면?** → 슬라이드 미표시, 바로 로그인 화면
- **앱을 재설치하면?** → 슬라이드 다시 표시 (로컬 저장소 초기화되므로)
- **중간에 앱을 닫으면?** → 다음 진입 시 슬라이드 처음부터

### 규칙

- 최초 1회만 표시. 완료 여부는 로컬에 저장
- 하단에 페이지 인디케이터 (● ● ○)

---

## 2. 소셜 로그인

### 정상 흐름

1. 로그인 화면에서 카카오/네이버/애플 중 선택한다
2. 해당 제공자의 동의 화면이 뜬다
3. 동의하면 앱으로 돌아온다
4. 처음 가입이면 → 계정이 자동 생성되고 미소속 홈으로 이동
5. 이미 가입한 사람이면 → 기존 계정으로 로그인되고 이전 상태의 홈으로 이동

### 예외

| 상황 | 동작 |
|---|---|
| 제공자 화면에서 취소 | 로그인 화면으로 복귀, 아무 안내 없음 |
| 제공자 인증은 됐는데 서버 오류 | "로그인에 실패했어요. 다시 시도해주세요" |
| 네트워크 끊김 | 오브: "연결이 불안정해요" + [다시 시도] |
| 같은 이메일로 다른 제공자 가입 시도 | 별도 계정으로 생성 (이메일이 아닌 provider + provider_id로 구분) |

### 규칙

- 제공자: 카카오, 네이버, 애플 (애플은 iOS 필수)
- 기존 Account/Person 구조 그대로 사용 (모델 변경 없음)
- 애플 로그인은 이메일 숨기기(Private Relay) 가능 → 이메일이 아닌 provider_id 기반으로 계정 매칭
- 애플은 최초 로그인 시에만 이름을 제공하므로 첫 응답에서 반드시 저장
- 토큰은 기기 보안 저장소에 보관. 만료 시 자동 갱신, 갱신 실패 시 재로그인

---

## 3. 센터 연결

### 정상 흐름

1. 센터 코드를 입력한다 (6자리 영숫자)
2. 센터 이름이 표시된다 ("○○심리상담센터에 연결할까요?")
3. 확인을 누른다
4. 전화번호를 입력한다 (최초 1회만)
5. SMS 인증번호(6자리)가 발송된다
6. 인증번호를 입력한다
7. "승인 요청을 보냈어요. 센터에서 확인하면 알려드릴게요" 메시지 표시
8. 승인 대기 홈으로 전환

### 예외

| 상황 | 동작 |
|---|---|
| 잘못된 센터 코드 | 입력 필드 하단에 "유효하지 않은 코드예요" |
| 이미 소속된 센터의 코드 | "이미 연결된 센터예요" |
| 이미 승인 대기 중인 센터 | "이미 승인 요청 중이에요" |
| 인증번호 틀림 | "인증번호가 맞지 않아요" (재입력 가능) |
| 인증번호 3분 초과 | "인증번호가 만료됐어요. 다시 받아주세요" |
| 5회 연속 실패 | 10분간 잠금. "잠시 후 다시 시도해주세요" |
| SMS 발송 실패 | "인증번호 발송에 실패했어요" |
| 센터에서 거절 | 푸시: "○○센터에서 요청을 확인할 수 없었어요" → 미소속으로 복귀. 동일 센터 재요청 가능 |

### 규칙

- 센터 코드: 6자리 영숫자, 입력 시 대문자 자동 변환, 센터별 고정 (만료 없음)
- 전화번호: 최초 센터 연결 시 1회만 입력. 추가 센터 연결 시 기존 번호 자동 사용
- 전화번호 변경: 마이페이지 > 개인정보 관리에서 재인증
- SMS 인증번호: 6자리 숫자, 유효 3분, 재발송 시 이전 번호 즉시 무효
- 일일 발송 제한: 동일 번호 10회/일

---

## 4. 센터 승인 (센터 측 동작)

내담자/보호자 구분은 앱에서 하지 않는다. **센터에서 승인 시 역할과 대상을 지정**한다.

### 정상 흐름 (센터 웹)

1. 승인 요청 목록에서 요청을 확인한다
2. 요청자 정보(이름, 전화번호)를 본다
3. 연결 대상(어떤 내담자)을 선택한다
4. 역할(내담자/보호자)을 선택한다
5. [승인] 또는 [거절]을 누른다
6. 승인하면 → 앱에 푸시 알림 → 앱이 소속 홈으로 전환

### 예외

| 상황 | 동작 |
|---|---|
| 해당 전화번호와 일치하는 내담자가 없을 때 | 센터가 수동으로 대상 지정 (전화번호 자동 매칭은 보조 수단) |
| 승인 후 앱이 포그라운드 상태 | 푸시 수신 → 자동으로 소속 홈 전환 |
| 승인 후 앱이 백그라운드/종료 상태 | 푸시 알림 표시 → 앱 진입 시 소속 홈 |

---

## 5. 사용자 상태 정의

| 상태 | 조건 | 홈 화면 |
|---|---|---|
| 미인증 | 로그인 전 | 로그인 화면 |
| 미소속 | 로그인 완료, 소속 센터 0개, 대기 0개 | 미소속 홈 |
| 승인 대기 | 대기 중인 요청 1개 이상 | 승인 대기 홈 |
| 소속 | 승인된 센터 1개 이상 | 소속 홈 |

앱 진입 시 서버에서 현재 상태를 받아 판별한다.

---

## 6. 앱 업데이트

### 정상 흐름

1. 앱을 실행한다
2. 서버에 현재 버전을 보낸다
3. 최소 지원 버전보다 낮으면 → 강제 업데이트 화면 (닫기 불가)
4. 최신 버전이 아니지만 최소 이상이면 → 하단에 "새 버전이 있어요" 배너 (닫기 가능)
5. 최신이면 → 아무 동작 없음

### 화면

**강제 업데이트**:
```
(오브) "새로운 버전이 나왔어요.
       업데이트 후 이용해주세요"
[업데이트 하기] → 스토어로 이동
```

닫기 버튼 없음. 업데이트하지 않으면 앱 사용 불가.

---

## 7. 선행 작업

- [ ] Account.provider에 "apple" 추가
- [ ] 애플 로그인 서버 검증 로직
- [ ] SMS 인증 인프라 구축 (발송 서비스 선정)
- [ ] 센터 코드 생성/관리 기능 (센터 웹)
- [ ] 센터 웹 승인 화면 (역할/대상 매칭 UI)

---

## 8. 미해결 이슈

- **ISSUE-006**: 애플 로그인 Private Relay 대응 상세
- **ISSUE-008**: 디바이스 토큰 관리 (다중 기기, 기존 전문가 앱 FCM 구조 재사용 여부)
- **ISSUE-009**: 앱 이름 확정 ("마인드엔서" 임시)
</script>

<script type="text/plain" id="doc-f02">
# F02. 홈 화면

> 앱을 열었을 때 "다음에 뭘 하면 되지?"에 0.5초 안에 답하는 화면

**Phase**: MVP

---

## 유저 스토리

- 성인 내담자로서, 앱을 열면 다음 상담이 언제인지 바로 알고 싶다
- 보호자로서, 내 자녀들의 다음 일정과 진행 상황을 한눈에 보고 싶다
- 미소속 사용자로서, 센터 없이도 앱에서 할 수 있는 게 있었으면 좋겠다

---

## 1. 소속 홈

### 정상 흐름

1. 앱을 연다
2. 오브 캐릭터와 상황별 멘트가 즉시 표시된다 (서버 호출 없이 로컬)
3. 일정 카드와 콘텐츠가 병렬로 로딩된다
4. 각 영역은 도착 순서대로 독립적으로 나타난다

### 화면 구성

```
┌─────────────────────────────────────┐
│  (오브 캐릭터)                      │
│  "내일 민준이 상담이 있어요"        │
├─────────────────────────────────────┤
│  ① 다음 일정                        │
│  5/21 수 14:00 · D-2                │
│  민준 · 상담 6회차 · 놀이치료센터   │
│  ━━━━━━━━━━░░░░░░░░░░ 5/10회       │
│  [길찾기]        [전체 보기 →]       │
│                                     │
│  5/23 금 10:00 · D-4                │
│  서연 · 언어평가 · 언어치료센터     │
│  ━━━░░░░░░░░░░░░░░░░░ 1/8회        │
│  [길찾기]                            │
├─────────────────────────────────────┤
│  ② 읽어볼 만한 글                   │
│  [가로 스크롤 카드]                  │
└─────────────────────────────────────┘
     [ 홈 ]              [ 마이 ]
```

### 일정 카드 동작

**표시 내용**:
- 날짜, 시간, D-day
- 대상 이름 (보호자인 경우 자녀 이름), 회차, 센터명
- 진행 바 또는 진행 텍스트

**D-day 규칙**:
- 오늘이면 `D-0` (강조색)
- 7일 이내면 `D-N`
- 7일 초과면 D-day 미표시

**진행 표시 규칙**:
- 총 회기수가 정해져 있으면 → 진행 바: `━━━━━━━━━━░░░░░░ 5/10회`
- 총 회기수가 없으면 (일반적) → 텍스트: `6회차 진행 중 · 3개월째`

**[길찾기] 버튼**:
- 센터 좌표가 있으면 → 기기 기본 지도 앱으로 길찾기 실행
- 좌표 없이 주소만 있으면 → 주소 텍스트로 지도 앱 실행
- 둘 다 없으면 → 버튼 자체가 미표시

**[전체 보기 →]**:
- 터치하면 타임라인 화면으로 이동 (→ F03)

**최대 표시**: 3건. 초과 시 "N건 더 보기 →".

### 역할별 일정 표시

| 케이스 | 홈에서 보이는 것 |
|---|---|
| 순수 내담자 | 내 일정만 표시 (섹션 구분 없음) |
| 순수 보호자 | 자녀 일정만 표시 (자녀 이름별 섹션) |
| 둘 다 (both) | "내 일정" 섹션 + 자녀 이름별 섹션 |

```
── 내 일정 ──────────────────
5/21 수  14:00
개인상담 3회차 · ○○상담센터

── 민준 ─────────────────────
5/21 수  16:30
상담 6회차 · 놀이치료센터 · D-2

── 서연 ─────────────────────
5/23 금  10:00
언어평가 · 언어치료센터 · D-4
```

- 데이터가 없는 섹션은 미표시
- 섹션 내 정렬: 시간순 (가까운 일정이 위)
- 세 케이스 모두 같은 컴포넌트로 처리 (조건부 렌더링)

### 다중 센터 통합

센터별로 나누지 않는다. 모든 센터의 일정을 시간순으로 합산. 센터명은 일정 카드 안에 라벨로 표시. 사용자는 "이번 주에 뭐가 있지?"로 생각하기 때문.

---

## 2. 미소속 홈

### 정상 흐름

1. 로그인 후 센터 연결 없이 홈에 진입한다
2. 오브 캐릭터와 센터 연결 안내가 표시된다
3. 자가진단과 콘텐츠를 이용할 수 있다

### 화면 구성

```
┌─────────────────────────────────────┐
│  (오브 캐릭터)                      │
│  나를 위한                          │
│  작은 변화의 시작                   │
│                                     │
│  [센터 코드로 연결하기]              │
├─────────────────────────────────────┤
│  자가진단                           │
│  우울 선별검사 (PHQ-9)       [시작] │
│  불안 선별검사 (GAD-7)       [시작] │
├─────────────────────────────────────┤
│  읽어볼 만한 글                     │
│  [콘텐츠 가로 스크롤]               │
└─────────────────────────────────────┘
```

**[센터 코드로 연결하기]** → 센터 코드 입력 화면으로 이동 (→ F01)

---

## 3. 승인 대기 홈

### 정상 흐름

1. 센터 코드를 입력하고 승인 대기 중이다
2. 오브가 대기 상태를 안내한다
3. 승인될 때까지 미소속 콘텐츠(자가진단 + 콘텐츠)를 이용할 수 있다
4. 센터에서 승인하면 → 푸시 알림 → 소속 홈으로 자동 전환

### 화면 구성

```
┌─────────────────────────────────────┐
│  (오브 캐릭터)                      │
│  승인 대기 중                       │
│  ○○심리상담센터에서 확인 중         │
│  "승인되면 알려드릴게요"            │
├─────────────────────────────────────┤
│  (미소속과 동일: 자가진단 + 콘텐츠) │
└─────────────────────────────────────┘
```

### 예외

| 상황 | 동작 |
|---|---|
| 여러 센터에 동시 대기 | 가장 최근 요청 센터명 표시 + "N개 센터 승인 대기 중" → 마이페이지 |
| 승인됐는데 앱이 포그라운드 | 푸시 수신 → 데이터 재호출 → 소속 홈 자동 전환 |
| 승인됐는데 앱이 꺼져 있었음 | 다음 앱 진입 시 소속 홈 |
| 센터에서 거절 | 미소속 홈으로 복귀. 거절 사유는 미표시 (→ F01 참조) |

---

## 4. 조건부 표시 규칙

| 영역 | 표시 조건 | 없을 때 |
|---|---|---|
| 캐릭터 멘트 | 항상 | 시간대별 기본 멘트 (→ F09) |
| 다음 일정 | 예정 일정 1건 이상 | 오브 멘트: "아직 예정된 일정이 없어요" (일정 카드 영역 자체 미노출) |
| 미션 | Phase 2 | 영역 미노출 |
| 콘텐츠 | 항상 | 일반 콘텐츠 |

**핵심 원칙**: 데이터 없는 빈 카드로 자리를 차지하지 않는다.

---

## 5. 예외 및 에러

| 상황 | 동작 |
|---|---|
| 일정 로딩 실패 | 일정 영역에 오브 멘트: "일정을 불러오지 못했어요" + [다시 시도] |
| 콘텐츠 로딩 실패 | 콘텐츠 영역만 미표시 (조용히 실패, 다른 영역 정상) |
| 전체 네트워크 오류 | 전체 화면 오브: "연결이 불안정해요" + [다시 시도] |
| 일정은 성공, 콘텐츠 실패 | 일정만 정상 표시 (각 영역 독립) |
| 아래로 당겨서 새로고침 | 모든 영역 재호출. 오브가 살짝 반짝이는 피드백 |

# F03. 일정 & 타임라인

> 홈 일정 카드에서 "전체 보기"를 누르면 진입하는 전체 상담 이력 화면

**Phase**: MVP

---

## 유저 스토리

- 보호자로서, 자녀의 전체 상담 이력을 한 화면에서 보고 싶다
- 내담자로서, 지금까지 몇 회 했고 앞으로 몇 회 남았는지 알고 싶다
- 보호자로서, 자녀가 여러 치료(놀이/미술)를 받을 때 각각 어디까지 진행됐는지 보고 싶다

---

## 1. 전체 흐름

```
홈 일정 카드 (→ F02)
    ↓ "전체 보기" 터치
타임라인 화면
    ↓ 완료 회차 터치
회차 상세 (바텀시트)
```

---

## 2. 타임라인 화면

### 왜 캘린더가 아닌 타임라인인가

- 주 1~2회 상담에 월간 캘린더는 빈 칸만 가득함
- 타임라인은 "뭘 했고, 다음에 뭘 하는지"가 한눈에 보임
- D-day, 카드 애니메이션 등 재미 요소 적용에 적합

### 화면 구성

자녀(또는 본인) > 센터 > 케이스 3단 계층으로 구성된다.

```
← 전체 일정

── 민준 · 놀이치료센터 ───────
  ━━━━━━━━━━░░░░░░ 5/10회

  ✓ 5/14  상담 5회차  완료
  ✓ 5/7   상담 4회차  완료
  ✓ 4/30  상담 3회차  완료
  · · · 2건 더 보기
  ● 5/21  상담 6회차  D-2  [길찾기]
  ○ 5/28  상담 7회차  D-9
  ○ 6/4   상담 8회차

── 서연 · 언어치료센터 ───────
  ━━━░░░░░░░░░░░░░ 1/8회

  ✓ 5/16  언어평가    완료
  ● 5/23  치료 1회차  D-4  [길찾기]
  ○ 5/30  치료 2회차
```

---

## 3. 회차 상태 표시

| 상태 | 아이콘 | 스타일 | 설명 |
|---|---|---|---|
| 완료 (`completed`) | ✓ | 정상 톤 | "완료" |
| 미방문 (`no_show`) | ─ | 흐린 톤 | "미방문" (부정적 느낌 배제, 사유 미표시) |
| 다음 예정 | ● | 강조색 + 볼드 | D-day 표시 + [길찾기] |
| 먼 미래 예정 | ○ | 흐린 톤 | D-day 7일 이내만 표시 |
| 취소 (`cancelled`) | — | **미노출** | 타임라인에서 완전히 제외 |

**"다음 예정" 판별**: 예정된 일정 중 가장 가까운 1건만 ● 스타일. 나머지 미래 일정은 ○.

---

## 4. 회차 터치 시 동작

바텀시트로 상세 정보 표시.

### 완료 회차

```
5/14 수 · 상담 5회차 · 완료
놀이치료센터
담당: 김상담 선생님
14:00 ~ 14:50
```

### 미방문 회차

```
5/7 수 · 상담 4회차 · 미방문
놀이치료센터
14:00 ~ 14:50
```

### 예정 회차

```
5/21 수 · 상담 6회차 · D-2
놀이치료센터
담당: 김상담 선생님
14:00 ~ 14:50
[길찾기]
```

> Phase 2에서 완료 회차에 상담사 노트(→ F11) + 미션 기록(→ F10) 추가 예정.

## 5. 케이스별 분리

같은 센터에서 여러 프로그램(놀이치료 + 미술치료)을 받는 경우, 치료 맥락이 다르므로 **케이스별 별도 타임라인**으로 표시한다.

```
── 민준 · 놀이치료센터 ───────

  [놀이치료 - 개별]
  6회차 진행 중 · 3개월째
  ✓ 5/14  상담 5회차  완료
  ● 5/21  상담 6회차  D-2  [길찾기]
  ○ 5/28  상담 7회차  D-9

  [미술치료 - 개별]
  2회차 진행 중 · 1개월째
  ✓ 5/12  치료 1회차  완료
  ● 5/19  치료 2회차  D-0  [길찾기]
```

- 케이스 이름 = `Program.name`에서 가져옴
- 활성 케이스가 위, 종결 케이스가 아래

---

## 6. 종결 케이스

종결된 케이스는 **접힌 상태(collapsed)**가 기본. 터치하면 펼쳐져서 전체 이력을 볼 수 있다.

```
  [미술치료 - 개별]              ← 활성 (펼쳐짐)
  2회차 진행 중 · 1개월째
  ...

  [놀이치료 - 개별]  종결  ▸    ← 종결 (접힘)
  12회 완료 · 6개월 · 2025.11~2026.04
```

- 종결 케이스 접힌 상태: 프로그램명 + "종결" 라벨 + 총 회차 + 기간
- 터치 → 펼침: 전체 회차 목록 표시 (활성 케이스와 동일 형태)

---

## 7. 진행 표시

| 조건 | 표시 |
|---|---|
| 총 회기수 정해져 있음 | 진행 바: `━━━━━━━━━━░░░░░░░░░░ 6/12회` |
| 총 회기수 없음 (일반적) | 텍스트: `6회차 진행 중 · 3개월째` |

**경과 기간 계산** (첫 회기 날짜 ~ 오늘):

| 경과 | 표시 |
|---|---|
| 1개월 미만 | "2주째" |
| 1~11개월 | "3개월째" |
| 12개월 이상 | "1년 2개월째" |

---

## 8. 완료 회차 접기

완료 회차가 5개 이상이면 최근 3건만 표시하고 나머지는 접는다.

```
  ✓ 5/14  상담 5회차  완료
  ✓ 5/7   상담 4회차  완료
  ✓ 4/30  상담 3회차  완료
  · · · 2건 더 보기              ← 터치하면 나머지 펼침
  ● 5/21  상담 6회차  D-2
```

---

## 9. 길찾기

**[길찾기] 버튼이 표시되는 조건**: 예정 회차(●, ○)이면서 센터 좌표 또는 주소가 있을 때.

| 상황 | 동작 |
|---|---|
| 좌표 있음 | 기기 기본 지도 앱으로 길찾기 (iOS: Apple Maps, Android: Google Maps) |
| 주소만 있음 | 주소 텍스트로 지도 앱 실행 |
| 둘 다 없음 | 버튼 미표시 |

---

## 10. 예외 및 에러

| 상황 | 동작 |
|---|---|
| 타임라인 로딩 실패 | 전체 화면 오브: "일정을 불러오지 못했어요" + [다시 시도] |
| 일부 센터 데이터만 실패 | 성공한 데이터만 표시 + 하단 배너: "일부 센터 정보를 불러오지 못했어요" |
| 일정이 하나도 없음 | 오브: "아직 예정된 일정이 없어요" |
| 아래로 당겨서 새로고침 | 전체 재호출 |

# F04. 검사 결과

> 센터에서 실시한 심리검사 결과를 열람하는 기능

**Phase**: MVP

---

## 유저 스토리

- 보호자로서, 우리 아이의 검사 결과를 앱에서 확인하고 싶다
- 내담자로서, 검사에서 어떤 결과가 나왔는지 알고 싶다
- 상담사로서, 검사 결과를 어디까지 공개할지 내가 결정하고 싶다

---

## 1. 전체 흐름

```
마이페이지 센터 카드 > "검사결과 N건" 터치 (→ F08)
    ↓
검사 결과 목록
    ↓ 개별 검사 터치
검사 결과 상세 (공개 수준에 따라 다름)
```

---

## 2. 공개 범위

검사 결과의 공개 범위는 **상담사가 결정**한다. 임상적 판단이 필요한 영역이므로 자동 공개하지 않는다.

| 수준 | 내담자에게 보이는 것 | 사용 예시 |
|---|---|---|
| **비공개** (기본값) | 검사 실시 이력만 (날짜 + 검사명) | 민감한 검사, 아직 결과 설명 전 |
| **요약 공개** | 해석 요약 + 종합 소견 | 대부분의 경우 |
| **전체 공개** | 점수 + 영역별 결과 + 종합 소견 | 자가진단형 검사, 경과 비교용 |

---

## 3. 검사 결과 목록

### 정상 흐름

1. 마이페이지 센터 카드에서 "검사결과 N건"을 터치한다
2. 해당 센터의 검사 결과 목록이 표시된다
3. 각 항목에 검사명, 날짜, 상담사 이름이 보인다

### 표시 규칙

| 공개 수준 | 목록에서 동작 |
|---|---|
| 비공개 | 검사명 + 날짜만 표시. 회색 처리. 터치 불가 |
| 요약/전체 공개 | 검사명 + 날짜 + "결과 보기 ›". 터치 가능 |

### 보호자인 경우

자녀별로 검사 결과가 구분된다. 자녀 이름이 섹션 헤더로 표시.

---

## 4. 검사 결과 상세

### 요약 공개일 때

```
← 종합심리검사

2026.05.10 실시
○○상담센터 · 김상담 선생님

[종합 소견]
전반적인 정서 상태는 또래 수준이며,
사회성 영역에서 약간의 주의가 필요합니다.

※ 자세한 내용은 담당 선생님과
  상담 시 확인해주세요.
```

### 전체 공개일 때

```
← 종합심리검사

2026.05.10 실시
○○상담센터 · 김상담 선생님

[영역별 결과]
정서 ──────── 양호
인지 ──────── 양호
사회성 ───── 주의 필요

[종합 소견]
전반적인 정서 상태는...

※ 자세한 내용은 담당 선생님과
  상담 시 확인해주세요.
```

**영역별 결과 시각화**:
- 양호: 초록 바
- 주의 필요: 주황 바
- 우려: 빨간 바

---

## 5. 종합 보고서

풀배터리 검사(여러 검사를 한번에 실시) 후 상담사가 발행하는 통합 보고서.

### 생성 플로우 (SaaS 측)

```
검사 실시 → AI 보고서 초안 생성 → 상담사 검수/수정 → 공개 범위 설정 → 발행
```

앱은 발행된 보고서만 열람. 생성/수정은 센터 웹에서만 가능.

### 보고서 화면

검사 결과 상세에서 "종합 보고서 보기 ›" 링크를 통해 진입.

```
← 종합 심리검사 결과

2026.05.10 실시 · ○○상담센터
김상담 선생님

[종합 소견]
전반적인 정서 상태는...

[영역별 결과]
정서 ──────── 주의 필요
인지 ──────── 양호
사회성 ───── 양호

※ 자세한 내용은 담당 선생님과
  상담 시 확인해주세요.
```

---

## 6. 예외 및 에러

| 상황 | 동작 |
|---|---|
| 비공개 검사 터치 시도 | 터치 불가 (disabled 상태, 회색) |
| 목록 로딩 실패 | 오브: "검사 결과를 불러오지 못했어요" + [다시 시도] |
| 상세 로딩 실패 | 스낵바: "결과를 불러오지 못했어요" |
| 접근 권한 없는 검사 접근 시도 | 목록에 아예 미노출 (서버에서 필터링) |
| 보고서가 아직 발행되지 않은 검사 | 목록에서 "결과 준비 중" 표시. 터치 불가 |

### 접근 권한 규칙

- 본인의 검사 결과만 볼 수 있다
- 보호자는 자녀의 검사 결과를 볼 수 있다
- 다른 내담자의 결과는 절대 노출되지 않는다

---

## 7. Phase 2 확장

- 동일 검사 재실시 시 시점별 점수 비교 차트
- 회기 비교 뷰 (→ F12)

# F05. 자가진단

> 미소속 사용자에게 제공하는 간이 심리 선별검사 (일회성 체험)

**Phase**: MVP

---

## 유저 스토리

- 미소속 사용자로서, 앱을 깔았는데 뭔가 해볼 수 있는 게 있으면 좋겠다
- 사용자로서, 내 우울/불안 수준이 어느 정도인지 간단히 확인해보고 싶다

---

## 1. 성격 및 목적

| 항목 | 내용 |
|---|---|
| 성격 | 가벼운 체험 콘텐츠 |
| 결과 저장 | **하지 않음** (화면을 벗어나면 소멸) |
| 이유 | 단일 검사 결과만으로는 의미 있는 이력이 안 됨. 종합 평가는 센터에서 |
| 목적 | 즉시 가치 제공 + 센터 연결 유도 |
| 노출 위치 | 미소속 홈, 승인 대기 홈 (소속 사용자에게는 홈에서 미노출) |

---

## 2. 검사 항목

MVP 예시 (최종 항목은 별도 선정 필요):

| 검사 | 대상 | 문항 수 | 소요 시간 |
|---|---|---|---|
| PHQ-9 | 우울 선별 | 9문항 | 약 2분 |
| GAD-7 | 불안 선별 | 7문항 | 약 2분 |

---

## 3. 전체 흐름

### 정상 흐름

1. 미소속 홈에서 자가진단 [시작]을 누른다
2. 검사 안내 화면이 표시된다 (검사명, 문항 수, 소요 시간, 안내 문구)
3. [시작하기]를 누른다
4. 한 문항씩 카드 형태로 표시된다
5. 선택지를 터치하면 0.3초 후 다음 문항으로 자동 전환된다
6. 마지막 문항 응답 후 결과 화면이 표시된다
7. 결과 화면에서 [센터 코드 입력하기] 또는 [홈으로 돌아가기]를 선택한다

### 검사 안내 화면

```
── 우울 선별검사 (PHQ-9) ──────

최근 2주간의 기분 상태를
확인해볼 수 있어요.

9문항 · 약 2분

이 검사는 간이 선별 도구이며,
정확한 진단을 대체하지 않아요.

[시작하기]
```

### 문항 응답 화면

```
── 질문 3/9 ───────────────────

최근 2주간,
잠들기 어렵거나 자꾸 깨거나
너무 많이 잤다.

○ 전혀 아니다
○ 며칠 동안
○ 일주일 이상
○ 거의 매일

━━━━━━━━░░░░░░░░░░░ 3/9
```

- 선택 → 체크 표시 + 색상 변경 → 0.3초 후 다음 문항 슬라이드
- 상단 프로그레스 바로 진행률 표시
- 이전 문항 돌아가기 가능 (좌 스와이프 또는 뒤로 버튼)

### 결과 화면

```
── 우울 선별검사 (PHQ-9) 결과 ──

당신의 점수: 12점
중등도 우울이 의심돼요.

이 결과는 간이 선별 결과이며,
정확한 평가는 전문가 상담을 통해
확인하는 것이 좋아요.

[센터 코드 입력하기]
[홈으로 돌아가기]
```

**결과 수준별 멘트 톤**:

| 수준 | 톤 |
|---|---|
| 정상 범위 | "현재 큰 어려움은 없어 보여요. 꾸준히 자신을 돌보는 것도 중요해요." |
| 경미 | "가벼운 어려움이 느껴지고 있어요. 전문가와 이야기해보는 것도 좋아요." |
| 중등도 이상 | "정확한 평가와 맞춤 상담은 전문 센터에서 받아보세요." |

---

## 4. 예외 및 엣지케이스

| 상황 | 동작 |
|---|---|
| 문항 응답 중 앱을 닫으면? | 진행 상태 소멸. 다음에 다시 시작하면 처음부터 |
| 문항 응답 중 뒤로가기를 누르면? | 확인: "검사를 그만둘까요? 결과가 저장되지 않아요" [그만두기] [계속하기] |
| 결과 화면을 벗어나면? | 결과 소멸. 다시 보려면 재검사 |
| 같은 검사를 다시 하면? | 제한 없이 재시도 가능. 이전 결과와 비교 없음 |
| 문항 로딩 실패 | 오브: "검사를 불러오지 못했어요" + [다시 시도] |
| 결과 계산(제출) 실패 | 스낵바: "결과를 확인할 수 없었어요" + [다시 제출] |

### 규칙

- 점수 계산은 서버에서 수행 (앱에 채점 로직 미포함)
- 서버는 제출된 답변을 처리 후 **저장하지 않고 폐기**
- 소속 사용자도 자가진단에 접근 가능하지만, 소속 홈에서는 노출되지 않음 (마이페이지 등 별도 진입점 필요 시 추후 결정)

---

## 5. 미해결 이슈

- **ISSUE-010**: 최종 검사 항목 선정, 진행 화면 형태 확정, 오브 캐릭터 연동 여부

# F06. 콘텐츠

> 태그 기반 맞춤 추천 콘텐츠 (매거진 + 카드뉴스)

**Phase**: MVP

---

## 유저 스토리

- 보호자로서, 우리 아이 상담과 관련된 읽을거리가 있으면 좋겠다
- 미소속 사용자로서, 센터 없이도 유용한 콘텐츠를 보고 싶다
- 내담자로서, 내 상담 주제에 맞는 글을 추천받고 싶다

---

## 1. 현황

- 매거진 100건 + 카드뉴스 100건 (자체 제작, 기확보)
- 소속/미소속 **공통**으로 홈 하단에 노출

---

## 2. 태그 기반 맞춤 추천

### 태그 구조

```
카테고리 태그 (1차): 아동 / 청소년 / 성인 / 부모교육
주제 태그 (2차, 복수 가능): 우울 / 불안 / 관계 / 자존감 / 감정조절 / 놀이치료 / 언어치료 / ...
```

하나의 콘텐츠에 카테고리 1개 + 주제 1~3개.

### 추천 로직

| 사용자 상태 | 추천 방식 |
|---|---|
| 소속 | 사용자의 케이스(상담 유형, 내담자 연령대) → 관련 태그 콘텐츠 우선, 뒤에 일반 |
| 미소속 | 태그 매칭 불가 → 인기순/최신순 |

**매칭 예시**:
- 아동 놀이치료 케이스 → `아동`, `놀이치료`, `감정조절` 태그 우선
- 성인 우울 상담 → `성인`, `우울`, `자존감` 태그 우선

---

## 3. 홈 표시

### 정상 흐름

1. 홈 하단에 "읽어볼 만한 글" 영역이 표시된다
2. 가로 스크롤로 콘텐츠 카드를 넘긴다
3. 카드를 터치하면 콘텐츠 상세로 이동한다
4. 마지막 카드 뒤에 "더 보기 →" → 전체 목록 진입

### 카드 구성

```
┌──────────┐  ┌──────────┐
│ (썸네일)  │  │ (썸네일)  │
│          │  │          │
│ 놀이치료, │  │ 아이의    │
│ 어떤 변화 │  │ 감정을    │
│ 가 생기나 │  │ 읽어주는  │
│ 요?      │  │ 3가지    │
│          │  │ 방법     │
│ 3분 읽기  │  │ 2분 읽기  │
└──────────┘  └──────────┘
               → 스크롤
```

- 홈에 최대 10건
- 카드 너비: 화면의 약 40%
- 썸네일 비율: 3:4

---

## 4. 전체 목록

"더 보기"를 터치하면 진입.

```
← 콘텐츠

[전체] [매거진] [카드뉴스]    ← 탭 필터

┌────────────────────────────┐
│ (썸네일) 놀이치료, 어떤     │
│          변화가 생기나요?   │
│          3분 읽기 · 아동    │
└────────────────────────────┘
...
```

- 세로 스크롤, 무한 스크롤 (커서 기반 페이지네이션)
- 탭 필터: 전체 / 매거진 / 카드뉴스

---

## 5. 콘텐츠 상세

### 매거진

상단 커버 이미지 + 본문 (HTML 또는 마크다운 렌더링).

```
← 놀이치료, 어떤 변화가 생기나요?

(커버 이미지)
아동 · 놀이치료 · 3분 읽기

본문 내용...
```

### 카드뉴스

이미지 슬라이드. 좌우 스와이프. 하단 인디케이터.

```
← 아이의 감정을 읽어주는 3가지 방법

┌────────────────────────────┐
│      (카드 이미지 1/5)      │
└────────────────────────────┘
        ● ○ ○ ○ ○
```

---

## 6. 예외 및 에러

| 상황 | 동작 |
|---|---|
| 홈 콘텐츠 로딩 실패 | 콘텐츠 영역만 미표시 (조용히 실패, 다른 영역 정상) |
| 전체 목록 로딩 실패 | 오브: "콘텐츠를 불러오지 못했어요" + [다시 시도] |
| 상세 로딩 실패 | 스낵바: "콘텐츠를 열 수 없어요" + 뒤로 이동 |
| 이미지 로딩 실패 | 깨진 이미지 대신 회색 플레이스홀더 |
| 콘텐츠가 하나도 없을 때 | 영역 자체 미표시 (발생 가능성 낮음, 200건 기확보) |

---

## 7. 선행 작업

- [ ] 콘텐츠 태그 체계 확정 (카테고리 + 주제 태그 목록)
- [ ] 기존 200건 태그 분류 (AI 자동 분류 + 수동 검수)
- [ ] 콘텐츠 저장/관리 방식 확정 (CMS 또는 DB 직접)

# F07. 알림

> 일정 리마인더 및 센터 관련 푸시 알림

**Phase**: MVP

---

## 유저 스토리

- 보호자로서, 내일 자녀 상담이 있으면 미리 알림을 받고 싶다
- 내담자로서, 상담 시간을 깜빡하지 않도록 당일 알림을 받고 싶다
- 사용자로서, 센터에서 승인해주면 바로 알고 싶다

---

## 1. 알림 종류 및 타이밍

타이밍은 **시스템 고정**. MVP에서 사용자가 타이밍을 변경할 수 없다.

| 알림 | 발송 시점 | 예시 |
|---|---|---|
| 일정 전날 | D-1 오전 10시 | "내일 14:00 상담이 있어요" |
| 일정 당일 | 1시간 전 | "1시간 뒤 상담이에요, 준비됐나요?" |
| 센터 승인 | 즉시 | "○○센터에서 승인했어요!" |
| 일정 변경 | 즉시 | "5/21 상담 일정이 변경됐어요" |
| 일정 취소 | 즉시 | "5/21 상담 일정이 취소됐어요" |

---

## 2. 다중 센터/자녀 규칙

### 같은 날 여러 일정

D-1 알림은 **묶어서 한 번** 발송:
- 1건: "내일 14:00 상담이 있어요"
- 2건 이상: "내일 일정이 2건 있어요"

당일 알림(1시간 전)은 **각각** 발송 (시간이 다르므로).

### 보호자 알림

자녀 이름으로 구분:

| 케이스 | 알림 예시 |
|---|---|
| 자녀 1명 | "내일 민준이 상담이 있어요" |
| 자녀 2명, 같은 날 | "내일 민준이 14:00, 서연이 16:00 상담이 있어요" |
| 본인도 내담자 (both) | 본인: "내일 상담이 있어요" + 자녀: "민준이 상담이 있어요" (별도 발송) |

### 양쪽 부모

같은 자녀에 보호자가 2명(부/모)이면 **양쪽 다 발송**. 각자의 기기로 동일 알림.

---

## 3. 알림 톤

캐릭터(오브) 톤을 적용한다. 딱딱한 시스템 알림이 아닌 따뜻한 안내 느낌.

| 기존 톤 | 오브 톤 |
|---|---|
| "예약일 1일 전입니다" | "내일 민준이 상담이 있어요" |
| "예약 시간 1시간 전" | "1시간 뒤 상담이에요, 준비됐나요?" |
| "승인 완료" | "○○센터에서 승인했어요!" |

---

## 4. 알림 설정

MVP: **전체 on/off만**. 마이페이지 > 알림 설정.

| 설정 | 동작 |
|---|---|
| 알림 켜기 | 모든 알림 수신 |
| 알림 끄기 | 모든 알림 차단 |

종류별 설정(일정만 켜기, 승인만 켜기 등)과 방해 금지 시간은 향후 추가.

---

## 5. 알림 터치 시 동작

| 알림 종류 | 터치 시 이동 |
|---|---|
| 일정 전날/당일 | 홈 화면 (일정 카드가 보이는 위치) |
| 센터 승인 | 홈 화면 (소속 홈으로 전환됨) |
| 일정 변경/취소 | 홈 화면 |

앱이 종료 상태에서 알림 터치 → 앱 실행 → 해당 화면으로 이동.

---

## 6. 예외

| 상황 | 동작 |
|---|---|
| 기기 알림 권한 꺼져 있음 | 앱 내에서 안내: "알림을 켜면 일정을 놓치지 않아요" + [설정으로 이동] |
| 로그아웃 | 디바이스 토큰 해제, 알림 중단 |
| 다중 기기 로그인 (폰 + 태블릿) | 모든 기기에 알림 발송 |
| 알림 off 상태에서 센터 승인 | 알림 미발송. 다음 앱 진입 시 소속 홈 전환 |

---

## 7. 인프라

- FCM 기반 (전문가 앱과 동일)
- 로그인 시 디바이스 토큰 서버 전송
- 로그아웃 시 토큰 해제

---

## 8. 미해결 이슈

- **ISSUE-008**: 디바이스 토큰 관리 상세 (다중 기기, 기존 전문가 앱 FCM 구조 재사용 여부)
</script>

# F08. 마이페이지

> 센터 정보, 프로필, 자녀 정보, 설정을 관리하는 화면

**Phase**: MVP

---

## 유저 스토리

- 보호자로서, 소속된 센터들의 정보(담당 선생님, 진행현황)를 한곳에서 보고 싶다
- 사용자로서, 프로필을 수정하고 알림 설정을 변경하고 싶다
- 보호자로서, 센터에 등록된 자녀 정보를 확인하고 싶다

---

## 1. 화면 구성

기능 나열이 아닌 **센터 카드 중심** 구조. 센터 단위로 정보를 묶는다.

```
── 프로필 ───────────────────
홍길동
hong@email.com
[프로필 수정 ›]

── 내 센터 ──────────────────
┌─────────────────────────┐
│ ○○놀이치료센터    [이용중] │
│ 담당: 김상담 선생님      │
│ 검사결과 2건 ›           │
│ 진행현황: 6/10회 ›       │
│ 내담자: 민준             │
└─────────────────────────┘
┌─────────────────────────┐
│ △△언어치료센터    [이용중] │
│ 담당: 이상담 선생님      │
│ 검사결과 1건 ›           │
│ 진행현황: 1/8회 ›        │
│ 내담자: 서연             │
└─────────────────────────┘

[+ 센터 코드로 추가 연결]

── 자녀 정보 ────────────────
민준 ›
서연 ›

── 설정 ─────────────────────
알림 설정 ›
개인정보 관리 ›
이용약관 ›
로그아웃
```

---

## 2. 센터 카드

### 이용중 센터

각 센터 카드에 표시되는 정보:

| 정보 | 터치 시 |
|---|---|
| 센터명 + [이용중] 라벨 | — |
| 담당 상담사 이름 | — |
| 검사결과 N건 › | 해당 센터 검사 결과 목록 (→ F04) |
| 진행현황: N/M회 › | 해당 센터 타임라인 (→ F03) |
| 내담자: 이름 | — (보호자인 경우에만 표시) |

### 센터 식별 (아바타)

```
센터 로고가 있는가?
  ├─ YES → 로고 이미지 (32px, 둥근 사각형)
  └─ NO  → 첫 글자 + 자동 배정 색상
           예: "해밀심리센터" → 파란 배경에 "해"
```

- 색상 풀: 6~8가지 구분 가능한 색상 순환 배정
- 2개 이상 센터가 default 아이콘이면 구분 불가 → 이니셜+색상으로 해결

### 종결 센터

이용중 센터 하단으로 이동. "종결" 라벨 + 기간 표시. 기록 열람만 가능.

```
┌─────────────────────────┐
│ □□상담센터        [종결]  │
│ 2025.11 ~ 2026.04       │
│ 상담 기록 보기 ›         │
└─────────────────────────┘
```

- "상담 기록 보기" 터치 → 종결 케이스 타임라인 (읽기 전용)
- 종결 센터의 데이터는 삭제되지 않음 (MVP 정책)

### 승인 대기 센터

센터 카드 목록에 대기 상태로 표시:

```
┌─────────────────────────┐
│ ○○심리상담센터   [승인 대기] │
│ 요청일: 2026.05.20       │
└─────────────────────────┘
```

터치 불가. 승인되면 자동으로 이용중으로 전환.

---

## 3. 자녀 정보

- **조회 전용**. 센터에서 등록한 데이터이며 앱에서 수정 불가
- 센터가 데이터 주도권을 가짐
- 자녀 이름 터치 → 자녀 기본 정보 표시 (이름, 생년월일, 소속 센터 등)

---

## 4. 프로필/설정

### 프로필 수정

수정 가능 항목: 이름
수정 불가 항목: 이메일 (소셜 로그인 연동), 전화번호 (별도 인증 필요)

### 알림 설정

MVP: 전체 on/off 토글 1개. (→ F07)

### 개인정보 관리

| 기능 | 동작 |
|---|---|
| 전화번호 변경 | 새 번호 입력 + SMS 재인증 |
| 계정 삭제 | 확인 다이얼로그 → 삭제 요청 (처리 정책은 별도 수립) |

### 로그아웃

1. [로그아웃] 터치
2. 확인: "로그아웃 할까요?" [취소] [로그아웃]
3. 로그아웃 → 토큰 삭제 + 디바이스 토큰 해제 → 로그인 화면

---

## 5. 센터 추가 연결

[+ 센터 코드로 추가 연결] 터치 → 센터 코드 입력 화면 (→ F01).
이미 전화번호가 등록되어 있으면 SMS 인증 단계 생략.

---

## 6. 예외 및 에러

| 상황 | 동작 |
|---|---|
| 소속 센터가 없을 때 | "내 센터" 영역에 [센터 코드로 연결하기] CTA만 표시 |
| 자녀가 없을 때 | "자녀 정보" 영역 미표시 |
| 센터 데이터 로딩 실패 | 센터 카드 영역에 "정보를 불러오지 못했어요" + [다시 시도] |
| 프로필 수정 실패 | 스낵바: "수정에 실패했어요" |
| 계정 삭제 요청 | "삭제를 요청했어요. 처리까지 최대 N일 소요됩니다" (정책 확정 후) |

---

## 7. 미해결 이슈

- **ISSUE-002**: 데이터 삭제 정책 (센터 종결/탈퇴 시 범위, 법적 검토 필요)
</script>

<script type="text/plain" id="doc-f09">
# F09. 오브 캐릭터

> 앱 전체에 걸친 감성적 가이드 캐릭터. 에러 상태까지 브랜드 경험으로 만든다

**Phase**: MVP

---

## 유저 스토리

- 사용자로서, 앱을 열었을 때 딱딱한 UI가 아니라 따뜻한 인사를 받고 싶다
- 사용자로서, 에러가 나도 당황하지 않고 무슨 상황인지 알고 싶다
- 사용자로서, 로딩 중에도 앱이 작동하고 있다는 느낌을 받고 싶다

---

## 1. 기본 정의

| 항목 | 내용 |
|---|---|
| 형태 | 빛/오브 (따뜻한 빛 덩어리, 추상형) |
| 성격 | 차분한 안내자, 따뜻한 톤 |
| 말투 | 느낌표 없이 마침표로 끝나는 차분한 톤 |
| MVP 역할 | 상황별 한 줄 멘트 + 시각 변화 + 에러/빈 상태 표현 |
| Phase 2 확장 | AI 성장 가이드의 인격으로 확장 |

---

## 2. 시각 변화

### 시간대별

| 시간대 | 오브 표현 | 기준 |
|---|---|---|
| 아침 (6~11시) | 밝은 금빛 (활기) | 기기 시간 |
| 낮 (11~17시) | 따뜻한 주황빛 | |
| 저녁 (17~21시) | 부드러운 보랏빛 (차분) | |
| 밤 (21~6시) | 은은한 달빛 | |

### 상황별

| 상황 | 오브 표현 |
|---|---|
| 일정 임박 (D-0, D-1) | 살짝 반짝임 |
| 상담 완료 직후 | 포근하게 퍼짐 |
| 7일 이상 미접속 후 재접속 | 조용히 흔들림 |
| 로딩 중 | 숨쉬듯 맥동 (스피너 대체) |
| 에러 | 흐릿해짐 |

---

## 3. 상황별 멘트

### 멘트 결정 로직

멘트는 **서버 호출 없이 로컬에서 즉시 결정**한다. 우선순위가 높은 조건부터 매칭하고, 해당되는 것이 없으면 시간대별 기본 멘트를 표시한다.

**우선순위**:

| 순위 | 조건 | 멘트 |
|---|---|---|
| 1 | 네트워크 오류 | "연결이 불안정해요" |
| 2 | 서버 오류 | "잠깐 문제가 생겼어요" |
| 3 | 7일 이상 미접속 후 재접속 | "다시 만나서 반가워요" |
| 4 | 일정 D-0 (당일) | "오늘 상담이 있어요" |
| 5 | 일정 D-1 (내일) | "내일 민준이 상담이 있어요" |
| 6 | 진행현황 50% 돌파 (최초 1회) | "벌써 절반이나 왔어요" |
| 7 | 예정 일정 없음 | "아직 예정된 일정이 없어요" |
| 8 | 해당 없음 | 시간대별 기본 멘트 |

**시간대별 기본 멘트**:

| 시간대 | 멘트 |
|---|---|
| 아침 | "좋은 아침이에요" |
| 낮 | "오늘은 여유로운 하루예요" |
| 저녁 | "오늘 하루도 수고했어요" |
| 밤 | "푹 쉬어요" |

### 보호자일 때

자녀 이름을 멘트에 포함: "내일 **민준이** 상담이 있어요"

자녀가 여러 명이고 내일 여러 일정이 있으면: "내일 일정이 2건 있어요" (이름 나열 대신 건수)

---

## 4. 에러/빈 상태 표현

일반적인 에러 페이지 대신 **오브가 상태를 표현**한다.

### 네트워크 오류

```
      (흐릿해진 오브)

  "연결이 불안정해요.
   잠시 후 다시 올게요"

      [다시 시도]
```

### 서버 오류

```
      (깜빡이는 오브)

  "잠깐 문제가 생겼어요.
   곧 괜찮아질 거예요"

      [다시 시도]
```

### 로딩 중

```
      (숨쉬듯 맥동하는 오브)

  (멘트 없음, 빛 애니메이션만)
```

기존 스피너 대신 오브 맥동 사용.

### 빈 데이터

```
      (조용히 떠있는 오브)

  "아직 예정된 일정이 없어요"
```

---

## 5. 다크 모드

오브가 빛 기반이라 다크 모드에서 시각적 효과 극대화:

- **라이트**: 밝은 배경 + 은은한 오브 → 차분하고 깨끗한
- **다크**: 어두운 배경 + 빛나는 오브 → 몰입감, 감성적

오브의 색상/밝기 값은 모드별로 별도 정의 필요.

---

## 6. 노출 위치

| 위치 | 오브 크기 | 역할 |
|---|---|---|
| 홈 상단 | 크게 | 메인 멘트 + 시간대 색상 |
| 에러 화면 | 중간 | 에러 상태 표현 + 안내 멘트 |
| 로딩 | 작게 | 스피너 대체 |
| 온보딩 슬라이드 | 크게 | 첫인상 + 일러스트 역할 |

<script type="text/plain" id="doc-f10">
# F10. 미션 & 기록

> 상담사가 설정한 미션을 앱에서 확인하고, 일상 기록을 남겨 상담사에게 전달한다

**Phase**: Phase 2

---

## 유저 스토리

- 보호자로서, 상담사가 알려준 이번 주 실천사항을 앱에서 확인하고 싶다
- 내담자로서, 상담 사이 기간에 뭘 하면 좋을지 알고 싶다
- 보호자로서, 일상에서 관찰한 아이의 변화를 간단히 기록하고 상담사에게 전달하고 싶다
- 상담사로서, 내담자/보호자의 일상 기록을 상담 전에 미리 확인하고 싶다

---

## 1. 전체 흐름

```
SaaS (상담사)              앱 (내담자/보호자)

회기별 미션 설정  ──→  홈에 이번 주 미션 카드 표시
                       ↓
                       [오늘 기록 남기기] 터치
                       ↓
                       3단계 기록 작성 (1분 이내)
                       ↓
기록 확인 ←──────────  "상담사에게 전달됩니다"
(상담 준비 자료)
```

---

## 2. 미션 표시

### 홈 미션 카드

상담사가 미션을 설정한 경우에만 표시. 미설정이면 영역 자체 미노출.

```
┌─────────────────────────────────────┐
│  이번 주 미션                        │
│                                     │
│  감정 이름 먼저 말해주기             │
│  아이가 화를 낼 때 행동을 지적하기   │
│  전에, 감정을 먼저 인정해주세요      │
│                                     │
│  [오늘 기록 남기기]                  │
│                                     │
│  ● ● ● ○ ○ ○ ○  이번 주 3회 기록   │
└─────────────────────────────────────┘
```

### 미션 유형

| 구분 | 예시 |
|---|---|
| 태도/반응 미션 | "아이가 화낼 때 감정 이름을 먼저 말해주세요" |
| 활동 미션 | "감정 날씨 카드 만들기", "하루 10분 산책" |

미션은 회기 기반으로 갱신. 상담사가 회기 후 다음 미션을 설정하면 앱에 반영.

---

## 3. 기록 플로우

### 정상 흐름

1. [오늘 기록 남기기]를 터치한다
2. 기록 유형을 선택한다 (미션 관련 / 일상 기록 / 둘 다)
3. 상황 설명을 입력한다 (필수)
4. 반응/느낌을 입력한다 (선택)
5. 완료 화면: 격려 메시지 + 주간 기록 도트 + "상담사에게 전달됩니다"

```
Step 1: 유형 선택        Step 2: 내용 입력       Step 3: 완료
○ 미션 관련              상황 설명 (필수)        잘 하셨어요
○ 일상 기록              반응/느낌 (선택)        ● ● ● ● ○  4회
○ 둘 다                                         상담사에게 전달됩니다
```

### 설계 원칙

| 원칙 | 적용 |
|---|---|
| 부담 최소화 | 최대 3단계, 1분 이내 완료 |
| 점진적 공개 | 필수 → 선택 순서로 |
| 즉각적 보상 | 격려 메시지 + 주간 누적 도트 |
| 의미 부여 | "상담사에게 전달됩니다" — 기록의 목적 명확화 |

### 예외

| 상황 | 동작 |
|---|---|
| 기록 작성 중 앱을 닫으면? | 작성 내용 소멸 (임시 저장 없음) |
| 기록 제출 실패 | 스낵바: "기록을 저장하지 못했어요" + [다시 시도] |
| 미션이 없는데 기록하고 싶으면? | "일상 기록"으로 직접 작성 가능 |
</script>

<script type="text/plain" id="doc-f11">
# F11. 전문가 노트

> 상담사가 회기 후 작성한 요약 노트를 내담자/보호자에게 제공

**Phase**: Phase 2

---

## 유저 스토리

- 보호자로서, 오늘 상담에서 무슨 이야기가 있었는지 알고 싶다
- 보호자로서, 상담사가 알려주는 실천사항을 다시 확인하고 싶다
- 상담사로서, 공개할 준비가 된 내용만 내담자에게 보여주고 싶다

---

## 1. 핵심 규칙

- **발행 기반 공개**: 상담사가 "발행" 버튼을 눌러야만 내담자에게 노출
- 작성 중인 초안은 절대 비공개
- 상담사가 공개 범위를 통제한다

---

## 2. 노트 구조

각 회기 노트는 2개 섹션:

| 섹션 | 내용 |
|---|---|
| 회기 요약 | 이번 회기에 뭘 했는지, 아이/내담자가 어떤 반응을 보였는지 |
| 실천 사항 | 다음 회기까지 일상에서 해볼 것 |

---

## 3. 동작

### 정상 흐름

1. 상담사가 SaaS에서 노트를 작성하고 "발행"한다
2. 내담자 앱에 푸시 알림: "5회기 요약 노트가 도착했어요"
3. 홈에 알림 카드가 표시된다
4. 터치하면 노트 목록으로 이동
5. 최신 회기가 펼쳐진 상태, 이전 회기는 접힌 상태

### 노트 목록 화면

아코디언 구조:

```
┌─────────────────────────────────────┐
│  전문가 기록                         │
│                                     │
│  ▼ 5회기 (5/7)              최신    │
│  ┌───────────────────────────────┐  │
│  │ 회기 요약                      │  │
│  │ 감정 카드 활동 진행. 이전보다   │  │
│  │ 감정 어휘가 다양해짐.          │  │
│  │                               │  │
│  │ 실천 사항                      │  │
│  │ 아이가 감정을 말할 때 즉시     │  │
│  │ 반응하지 말고 3초 기다려주세요  │  │
│  └───────────────────────────────┘  │
│                                     │
│  ▶ 4회기 (4/30)                     │
│  ▶ 3회기 (4/23)                     │
└─────────────────────────────────────┘
```

### 예외

| 상황 | 동작 |
|---|---|
| 발행된 노트가 없음 | "아직 도착한 기록이 없어요" |
| 노트 로딩 실패 | 오브: "기록을 불러오지 못했어요" + [다시 시도] |
| 상담사가 발행 후 수정하면? | 수정 내용 자동 반영 (별도 알림 없음) |
| 상담사가 발행을 취소(회수)하면? | 앱에서 해당 노트 비노출 |

---

## 4. 미해결 이슈

- **ISSUE-001**: 상담사의 노트 작성 부담, 실제 수요 검증 필요

# F12. AI 성장 가이드

> AI 기반 치료 보조: 인사이트 요약, 활동 제안, 변화 비교

**Phase**: Phase 3

---

## 유저 스토리

- 보호자로서, 지금까지의 상담 과정에서 아이가 어떻게 변하고 있는지 한눈에 알고 싶다
- 내담자로서, "정말 나아지고 있는 건가?"에 대한 확신을 갖고 싶다
- 보호자로서, 상담 사이 기간에 집에서 아이와 어떤 활동을 하면 좋을지 알고 싶다

---

## 1. AI 인사이트

상담사 노트 + 내담자/보호자 기록을 종합해서 자동 생성하는 진행 요약.

```
"감정을 언어로 표현하는 빈도가
 최근 3주간 늘고 있어요.
 특히 '화나다' 외에 '속상하다',
 '답답하다' 같은 표현이 새로
 나타났어요."

 최근 기록 5건 · 회기 노트 2건 기반
```

- 구체적 변화를 언급 (추상적 격려가 아닌 데이터 기반)
- 위치: 타임라인 상단 — 스크롤 전 "지금 어디쯤인지" 파악

---

## 2. AI 퀘스트

이전 회기 내용을 기반으로 집에서 할 수 있는 활동 제안. 오브 캐릭터가 안내 역할.

---

## 3. 성장 리포트

주간/월간 변화 요약을 자동 생성하고 푸시 알림으로 전달.

---

## 4. 회기 비교 뷰

"정말 나아지고 있나?"에 대한 시각적 답. 1회기 vs 현재를 대조.

```
── 변화 비교 (1회기 → 현재) ──

실제 반응 대조:
  1회기: "싫어! 안 할 거야!"
  현재:  "좀 쉬고 나서 할게요"

변화 지표:
  감정 표현    ██░░░░░░ → ██████░░
  상담 참여도  ███░░░░░ → ███████░

키워드 변화:
  ~~싫어~~ ~~안해~~ → 쉬고 할게 괜찮아
```

- 실제 발화/행동 대조가 가장 감정적으로 와닿음
- 바 차트로 영역별 변화 시각화
- 키워드 대조로 언어 변화 가시화

---

## 5. 전제 조건

- F10(미션 & 기록) + F11(전문가 노트)가 선행되어야 분석할 데이터가 축적됨
- AI 치료 보조 콘텐츠의 효과성에 대한 연구 기반 검증 필요
- 개인정보 처리 방침 명확화 (AI 분석 동의 절차)

function buildTOC(md) {
  const headings = [];
  const lines = md.split('\n');
  for (const line of lines) {
    const m2 = line.match(/^## (.+)/);
    const m3 = line.match(/^### (.+)/);
    if (m2) headings.push({ level: 2, text: m2[1], id: slugify(m2[1]) });
    else if (m3) headings.push({ level: 3, text: m3[1], id: slugify(m3[1]) });
  }
  if (headings.length < 2) return '';
  let html = '<div class="toc"><div class="toc-title">목차</div>';
  for (const h of headings) {
    const cls = h.level === 3 ? ' class="toc-h3"' : '';
    html += '<a' + cls + ' href="#' + h.id + '">' + h.text + '</a>';
  }
  html += '</div>';
  return html;
}

function slugify(text) {
  return text.replace(/[^\w가-힣\s-]/g, '').replace(/\s+/g, '-').toLowerCase();
}

function getPhaseClass(md) {
  if (md.includes('**Phase**: MVP')) return 'phase-mvp';

let searchTimeout;
function handleSearch(query) {
  clearTimeout(searchTimeout);
  searchTimeout = setTimeout(function() { doSearch(query); }, 300);
}

function doSearch(query) {
  if (!query || query.length < 2) {
    navigate(currentKey);
    return;
  }
  const titles = {
    readme:'전체 개요', screenmap:'화면 구성도', principles:'설계 원칙',
    f01:'F01. 인증 & 온보딩', f02:'F02. 홈 화면', f03:'F03. 일정 & 타임라인',
    f04:'F04. 검사 결과', f05:'F05. 자가진단', f06:'F06. 콘텐츠',
    f07:'F07. 알림', f08:'F08. 마이페이지', f09:'F09. 오브 캐릭터',
    f10:'F10. 미션 & 기록', f11:'F11. 전문가 노트', f12:'F12. AI 성장 가이드'
  };
  const results = [];
  for (const [key, md] of Object.entries(docs)) {
    const lines = md.split('\n');
    for (let i = 0; i < lines.length; i++) {
      if (lines[i].toLowerCase().includes(query.toLowerCase())) {
        results.push({
          key: key, title: titles[key] || key,
          line: lines[i].replace(/[#*`|]/g, '').trim(),
          lineNum: i
        });
        if (results.length > 30) break;
      }
    }
    if (results.length > 30) break;
  }

  let html = '<h1>검색 결과</h1><p>"' + query + '" — ' + results.length + '건</p><hr>';
  const grouped = {};
  results.forEach(function(r) {
    if (!grouped[r.key]) grouped[r.key] = { title: r.title, items: [] };
    grouped[r.key].items.push(r);
  });
  for (const [key, group] of Object.entries(grouped)) {
    html += '<h3 style="margin-top:24px;cursor:pointer;color:var(--accent)" onclick="navigate(\'' + key + '\')">' + group.title + '</h3>';
    group.items.forEach(function(item) {
      const escaped = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      const highlighted = item.line.replace(
        new RegExp('(' + escaped + ')', 'gi'),
        '<mark>$1</mark>'
      );
      html += '<p style="padding:4px 0;font-size:14px;cursor:pointer;color:#555" onclick="navigate(\'' + key + '\')">' + highlighted + '</p>';
    });
  }
  if (results.length === 0) html += '<p style="color:#999;margin-top:20px">검색 결과가 없습니다.</p>';
  document.getElementById('md-content').innerHTML = html;
}

// Keyboard shortcut
document.addEventListener('keydown', function(e) {
  if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
    e.preventDefault();
    document.getElementById('searchInput').focus();
  }
  if (e.key === 'Escape') {
    document.getElementById('searchInput').value = '';
    document.getElementById('searchInput').blur();
    navigate(currentKey);
  }
});

// Init
(function() {
  var hash = location.hash.slice(1);
  if (hash && docs[hash]) navigate(hash);
  else navigate('readme');
})();
