                            { name: 'uid', type: 'UUID', constraints: ['UK'], comment: '외부 식별자' },
                            { name: 'created_at', type: 'TIMESTAMP', constraints: [], comment: '생성 시각' },
                            { name: 'updated_at', type: 'TIMESTAMP', constraints: [], comment: '수정 시각' },
                            { name: 'center_id', type: 'INTEGER', constraints: ['FK'], comment: '센터 ID (테넌트)' },
                            { name: 'unique_token', type: 'VARCHAR(100)', constraints: ['UK'], comment: '고유 토큰' },
                            { name: 'case_id', type: 'INTEGER', constraints: ['FK'], comment: '케이스 ID' },
                            { name: 'recipients', type: 'JSONB', constraints: [], comment: '수신자 정보 (JSON)' },
                            { name: 'expired_at', type: 'TIMESTAMP', constraints: [], comment: '만료 시각' }
                        ],
                        relationships: [
                            '← assessment_cases (N:1, FK: case_id, ON DELETE CASCADE)'
                        ]
                    },
                    {
                        name: 'assessment_final_reports',
                        tenant: true,
                        module: 'assessment/report',
                        description: '종합 보고서',
                        fields: [
                            { name: 'id', type: 'INTEGER', constraints: ['PK'], comment: 'Primary Key' },
                            { name: 'uid', type: 'UUID', constraints: ['UK'], comment: '외부 식별자' },
                            { name: 'created_at', type: 'TIMESTAMP', constraints: [], comment: '생성 시각' },
                            { name: 'updated_at', type: 'TIMESTAMP', constraints: [], comment: '수정 시각' },
                            { name: 'center_id', type: 'INTEGER', constraints: ['FK'], comment: '센터 ID (테넌트)' },
                            { name: 'case_id', type: 'INTEGER', constraints: ['FK', 'UK'], comment: '케이스 ID (1:1)' },
                            { name: 'payload', type: 'JSONB', constraints: [], comment: '보고서 데이터 (JSON)' }
                        ],
                        relationships: [
                            '← assessment_cases (1:1, FK: case_id, ON DELETE CASCADE)'
                        ]
                    }
                        ]
                    }
                }
            },

            schedule: {
                name: '📅 Schedule',
                description: '일정 관리 모듈',
                submodules: {
                    main: {
                        name: 'Schedule (일정)',
                        description: '다양한 도메인의 일정 관리 (Polymorphic)',
                        tables: [
                    {
                        name: 'schedules',
                        tenant: true,
                        module: 'schedule',
                        description: '일정 (Assessment, Counseling 등)',
                        fields: [
                            { name: 'id', type: 'INTEGER', constraints: ['PK'], comment: 'Primary Key' },
                            { name: 'uid', type: 'UUID', constraints: ['UK'], comment: '외부 식별자' },
                            { name: 'created_at', type: 'TIMESTAMP', constraints: [], comment: '생성 시각' },
                            { name: 'updated_at', type: 'TIMESTAMP', constraints: [], comment: '수정 시각' },
                            { name: 'center_id', type: 'INTEGER', constraints: ['FK'], comment: '센터 ID (테넌트)' },
                            { name: 'related_type', type: 'VARCHAR(20)', constraints: [], comment: '연결 타입 (Enum: ASSESSMENT/COUNSELING)' },
                            { name: 'related_id', type: 'INTEGER', constraints: [], comment: '연결 ID (Polymorphic FK)' },
                            { name: 'start_time', type: 'TIMESTAMP', constraints: [], comment: '시작 시각' },
                            { name: 'end_time', type: 'TIMESTAMP', constraints: [], comment: '종료 시각' },
                            { name: 'assigned_specialist_id', type: 'INTEGER', constraints: [], comment: '담당자 ID' },
                            { name: 'room_name', type: 'VARCHAR(100)', constraints: [], comment: '검사실/상담실' },
                            { name: 'status', type: 'VARCHAR(20)', constraints: [], comment: '상태 (Enum)' },
                            { name: 'notes', type: 'TEXT', constraints: [], comment: '메모' }
                        ],
                        relationships: [
                            '← assessment_sessions (1:1, Polymorphic: related_type=ASSESSMENT)',
                            '← counseling_sessions (1:1, Polymorphic: related_type=COUNSELING, 향후)'
                        ]
                    }
                        ]
                    }
                }
            }
        };

        // ========================================
        // State
        // ========================================
        let currentModule = 'overview';
        let currentSubmodule = 'main';

        // ========================================
        // UI 렌더링
        // ========================================
        function renderOverview(tables) {
            let html = '<div class="table-section"><h3>테이블 목록</h3>';
            html += '<table class="schema-table"><thead><tr>';
            html += '<th>테이블명</th><th>모듈</th><th>테넌트</th><th>설명</th>';
            html += '</tr></thead><tbody>';

            tables.forEach(table => {
                html += '<tr>';
                html += `<td><span class="field-name">${table.name}</span></td>`;
                html += `<td><span class="meta-badge module">${table.module}</span></td>`;
                html += `<td><span class="meta-badge ${table.tenant ? 'tenant' : 'no-tenant'}">${table.tenant ? '✅ Tenant' : '❌ No Tenant'}</span></td>`;
                html += `<td>${table.description}</td>`;
                html += '</tr>';
            });

            html += '</tbody></table></div>';
            return html;
        }

        function renderTables(tables) {
            let html = '';

            tables.forEach(table => {
                html += '<div class="table-section">';
                html += `<h3>${table.name}</h3>`;
                html += '<div class="table-meta">';
                html += `<span class="meta-badge ${table.tenant ? 'tenant' : 'no-tenant'}">${table.tenant ? '✅ Tenant' : '❌ No Tenant'}</span>`;
                html += `<span class="meta-badge module">${table.module}</span>`;
                html += '</div>';
                html += `<p>${table.description}</p>`;

                html += '<table class="schema-table"><thead><tr>';
                html += '<th>컬럼명</th><th>타입</th><th>제약조건</th><th>설명</th>';
                html += '</tr></thead><tbody>';

                table.fields.forEach(field => {
                    html += '<tr>';
                    html += `<td><span class="field-name">${field.name}</span></td>`;
                    html += `<td><span class="field-type">${field.type}</span></td>`;
                    html += '<td>';
                    field.constraints.forEach(c => {
                        html += `<span class="constraint-badge ${c.toLowerCase()}">${c}</span>`;
                    });
                    html += '</td>';
                    html += `<td>${field.comment}</td>`;
                    html += '</tr>';
                });

                html += '</tbody></table>';

                if (table.relationships && table.relationships.length > 0) {
                    html += '<div class="relationships">';
                    html += '<h4>🔗 관계</h4><ul>';
                    table.relationships.forEach(rel => {
                        html += `<li><code>${rel}</code></li>`;
                    });
                    html += '</ul></div>';
                }

                html += '</div>';
            });

            return html;
        }

        function renderModuleSelector() {
            const selector = document.getElementById('module-selector');
            selector.innerHTML = '';

            Object.keys(modules).forEach((key, index) => {
                const module = modules[key];
                const btn = document.createElement('button');
                btn.className = `module-btn ${index === 0 ? 'active' : ''}`;
                btn.textContent = module.name;
                btn.onclick = () => switchModule(key);
                selector.appendChild(btn);
            });
        }

        function switchModule(moduleKey) {
            currentModule = moduleKey;
            currentSubmodule = Object.keys(modules[moduleKey].submodules)[0];

            // 메인 모듈 버튼 활성화
            document.querySelectorAll('.module-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            // 서브모듈 탭과 콘텐츠 렌더링
            renderSubmoduleTabs();
            renderContent();
        }

        function renderSubmoduleTabs() {
            const tabsContainer = document.getElementById('tabs');
            tabsContainer.innerHTML = '';

            const submodules = modules[currentModule].submodules;
            Object.keys(submodules).forEach((key, index) => {
                const submodule = submodules[key];
                const tab = document.createElement('button');
                tab.className = `tab ${index === 0 ? 'active' : ''}`;
                tab.textContent = submodule.name;
                tab.onclick = () => switchSubmodule(key);
                tabsContainer.appendChild(tab);
            });
        }

        function switchSubmodule(submoduleKey) {
            currentSubmodule = submoduleKey;

            // 서브모듈 탭 활성화
            document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
            event.target.classList.add('active');

            // 콘텐츠 렌더링
            renderContent();
        }

        function renderContent() {
            const contentContainer = document.getElementById('content');
            const submodule = modules[currentModule].submodules[currentSubmodule];

            let html = `
                <div class="module-info">
                    <h2>${submodule.name}</h2>
                    <p>${submodule.description}</p>
                </div>
            `;

            if (currentModule === 'overview') {
                html += renderOverview(submodule.tables);
            } else {
                html += renderTables(submodule.tables);
            }

            contentContainer.innerHTML = html;
        }

        // ========================================
        // 초기화
        // ========================================
        document.addEventListener('DOMContentLoaded', () => {
            renderModuleSelector();
            renderSubmoduleTabs();
            renderContent();
        });
    </script>
</body>
</html>
