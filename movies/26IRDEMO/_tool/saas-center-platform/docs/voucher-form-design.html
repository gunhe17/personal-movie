function icon(name, cls='w-5 h-5'){ return `<svg class="${cls}" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">${ICONS[name]||''}</svg>`; }

const BLUE={bg:'bg-blue-50',ring:'ring-blue-200',text:'text-blue-600'};
const ORANGE={bg:'bg-orange-50',ring:'ring-orange-200',text:'text-orange-600'};
const EMERALD={bg:'bg-emerald-50',ring:'ring-emerald-200',text:'text-emerald-600'};
const VIOLET={bg:'bg-violet-50',ring:'ring-violet-200',text:'text-violet-600'};
const SLATE={bg:'bg-slate-100',ring:'ring-slate-200',text:'text-slate-600'};

/* ===== table rendering ===== */
function col(name,type,o={}){ return {name,type,...o}; }
function badge(t,c){ return `<span class="rounded ${c} px-1 py-px text-[9.5px] font-bold leading-none">${t}</span>`; }
function tableBadge(l){
  const m={'유지':'bg-slate-100 text-slate-500','변경':'bg-orange-100 text-orange-700','재정의':'bg-blue-100 text-blue-700','신규':'bg-emerald-100 text-emerald-700'};
  return `<span class="rounded-md ${m[l]||'bg-slate-100 text-slate-500'} px-1.5 py-0.5 text-[10px] font-semibold">${l}</span>`;
}
function fieldRow(f){
  if(f.ellipsis) return `<div class="px-4 py-1.5 text-[11px] text-slate-400">${f.name}</div>`;
  let b='';
  if(f.pk) b+=badge('PK','bg-amber-100 text-amber-700');
  if(f.fk) b+=badge('FK→'+f.fk,'bg-sky-100 text-sky-700');
  if(f.uq) b+=badge('UQ','bg-violet-100 text-violet-700');
  if(f.idx) b+=badge('IDX','bg-emerald-100 text-emerald-700');
  if(f.chg) b+=badge('변경','bg-orange-100 text-orange-700');
  if(f.add) b+=badge('NEW','bg-emerald-100 text-emerald-700');
  if(f.nullable) b+=badge('NULL','bg-slate-100 text-slate-400');
  const muted=f.base?'text-slate-400':(f.hot?'text-orange-700 font-semibold':'text-slate-700');
  return `<div class="flex items-center gap-1.5 px-4 py-1.5 ${f.hot?'bg-orange-50/40':''}">
    <span class="font-mono text-[12.5px] ${muted}">${f.name}</span>${b}
    ${f.note?`<span class="truncate text-[11px] text-slate-400">${f.note}</span>`:''}
    <span class="ml-auto shrink-0 font-mono text-[11px] text-slate-400">${f.type}</span></div>`;
}
function tableCard(t){
  const a=t.accent;
  return `<div class="overflow-hidden rounded-xl border border-slate-200 bg-white ${t.deferred?'opacity-60':''}">
    <div class="flex items-center gap-2 border-b border-slate-200 bg-slate-50/60 px-3 py-2">
      <span class="flex h-7 w-7 items-center justify-center rounded-lg ${a.bg} ${a.text} ring-1 ${a.ring}">${icon(t.iconName,'w-4 h-4')}</span>
      <span class="font-mono text-sm font-semibold text-slate-800">${t.name}</span>
      ${t.badge?tableBadge(t.badge):''}
      <span class="ml-auto text-[11px] text-slate-400">${t.owner||''}</span>
    </div>
    <div class="divide-y divide-slate-100">${t.fields.map(fieldRow).join('')}</div>
    ${t.extra?`<div class="border-t border-slate-200 px-4 py-1.5 font-mono text-[10.5px] text-violet-600">${t.extra}</div>`:''}
    ${t.note?`<div class="border-t border-slate-200 bg-slate-50/60 px-4 py-2 text-[11px] leading-relaxed text-slate-500">${t.note}</div>`:''}
  </div>`;
}
function relCard(b){
  return `<div class="flex gap-3 rounded-xl border border-slate-200 bg-white px-4 py-3">
    <span class="mt-0.5 flex h-8 w-8 shrink-0 items-center justify-center rounded-lg ${b.accent?b.accent.bg:'bg-slate-100'} ${b.accent?b.accent.text:'text-slate-600'} ring-1 ${b.accent?b.accent.ring:'ring-slate-200'}">${icon(b.icon,'w-4 h-4')}</span>
    <div><div class="font-semibold text-slate-900 text-sm">${b.title}</div>
    <p class="mt-1 text-[12.5px] leading-relaxed text-slate-600">${b.body}</p></div></div>`;
}

/* ===== 개념: 데이터 평면 vs 표현 평면 ===== */
function planeChip(t,sub,cls){ return `<div class="rounded-lg border ${cls} px-2.5 py-1.5 text-center">
  <div class="font-mono text-[12px] font-semibold">${t}</div>${sub?`<div class="text-[10px] text-slate-400">${sub}</div>`:''}</div>`; }

function conceptDiagram(){
  return `<div class="canvas rounded-2xl border border-slate-200 bg-white p-5">
    <div class="grid grid-cols-1 gap-4 md:grid-cols-2">
      <!-- 데이터 평면 -->
      <div class="rounded-xl border border-emerald-200 bg-emerald-50/40 p-4">
        <div class="mb-2 flex items-center gap-1.5 text-[12px] font-bold text-emerald-700">${icon('queue-list','w-4 h-4')} fields — 데이터 평면</div>
        <p class="mb-3 text-[11px] text-slate-500">"무엇을 수집하는가". 사용자가 채우는 값은 이 단위로 1개만 저장.</p>
        <div class="space-y-2">
          ${planeChip('applicant_name','text','border-emerald-200 bg-white text-emerald-700')}
          ${planeChip('rrn','주민등록번호','border-emerald-200 bg-white text-emerald-700')}
          ${planeChip('disability_types','checkbox_group','border-emerald-200 bg-white text-emerald-700')}
        </div>
      </div>
      <!-- 표현 평면 -->
      <div class="rounded-xl border border-blue-200 bg-blue-50/40 p-4">
        <div class="mb-2 flex items-center gap-1.5 text-[12px] font-bold text-blue-700">${icon('map-pin','w-4 h-4')} elements — 표현 평면</div>
        <p class="mb-3 text-[11px] text-slate-500">"어디에 어떻게 그리는가". 페이지 좌표(rect)·z를 가진 위젯. OCR 오버레이가 그대로 매핑.</p>
        <div class="grid grid-cols-3 gap-1.5">
          ${planeChip('text','e1','border-blue-200 bg-white text-blue-700')}
          ${Array.from({length:5}).map((_,i)=>planeChip('box','rrn·'+i,'border-blue-200 bg-white text-blue-700')).join('')}
          ${planeChip('☑ 지체','e10','border-blue-200 bg-white text-blue-700')}

    </div>
    <div class="mt-4 flex items-center justify-center gap-2 text-[12px] font-semibold text-violet-600">

    </div>
  </div>`;
}

/* ===== 생명주기: draft ↔ published ===== */
function lifecycleDiagram(){
  const box=(title,sub,cls,inner)=>`<div class="flex-1 rounded-xl border ${cls} p-4">
    <div class="mb-1 font-mono text-[13px] font-semibold">${title}</div>
    <div class="mb-3 text-[11px] text-slate-400">${sub}</div>${inner}</div>`;
  const chip=(t,c)=>`<span class="inline-block rounded ${c} px-1.5 py-0.5 text-[10.5px] font-semibold">${t}</span>`;
  return `<div class="canvas rounded-2xl border border-slate-200 bg-white p-5">
    <div class="flex flex-col items-stretch gap-3 md:flex-row md:items-center">
      ${box('status: draft','저작 · OCR 오버레이 편집','border-orange-200 bg-orange-50/40 text-orange-700',
        `<div class="space-y-1.5 text-[11.5px] text-slate-600">
