apiVersion: apps/v1
kind: Deployment
metadata:
  name: mindscope-redis
  namespace: mindscope-staging
  labels:
    app: mindscope-redis
    environment: staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mindscope-redis
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: mindscope-redis
        environment: staging
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          command: ["redis-server"]
          args:
            - "--maxmemory"
            - "128mb"
            - "--maxmemory-policy"
            - "allkeys-lru"
            - "--appendonly"
            - "yes"
            - "--appendfsync"
            - "everysec"
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: "25m"
              memory: "64Mi"
            limits:
              cpu: "100m"
              memory: "192Mi"
          volumeMounts:
            - name: redis-data
              mountPath: /data
      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: mindscope-redis-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mindscope-redis-pvc
  namespace: mindscope-staging
  labels:
    app: mindscope-redis
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: gp3
  resources:
    requests:
      storage: 1Gi
