apiVersion: apps/v1
kind: Deployment
metadata:
  name: mindscope-api
  namespace: mindscope-prod
  labels:
    app: mindscope-api
    environment: prod
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mindscope-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: mindscope-api
        environment: prod
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: api
          image: 786180311928.dkr.ecr.ap-northeast-2.amazonaws.com/mindscope-prod/api:v1.6.11
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: mindscope-api-config
            - secretRef:
                name: mindscope-api-secret
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
