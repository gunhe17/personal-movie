apiVersion: v1
kind: ConfigMap
metadata:
  name: mindscope-api-config
  namespace: mindscope-prod
data:
  APP_ENV: "production"
  DEBUG: "false"
  APP_NAME: "SaaS Center Platform"
  APP_VERSION: "1.0.0"
  JWT_ALGORITHM: "HS256"
  ACCESS_TOKEN_EXPIRE_MINUTES: "30"
  AWS_REGION: "ap-northeast-2"
  S3_BUCKET_ENABLED: "true"
  SMTP_SERVER: "smtps.hiworks.com"
  SMTP_PORT: "587"
  HOST_EMAIL: "no-reply@insighter.co.kr"
  FRONTEND_URL: "https://app.mindscope.kr"
  # Scheduler
  ENABLE_SCHEDULER: "true"
  # Redis
  REDIS_ENABLED: "false"
  AI_WORKER_MODE: "embedded"
  # Firebase
  FIREBASE_ENABLED: "true"
  FIREBASE_PROJECT_ID: "mindscope-dev"
