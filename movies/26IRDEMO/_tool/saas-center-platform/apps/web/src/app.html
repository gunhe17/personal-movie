<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      // 사이드바 상태를 렌더링 전에 CSS 변수로 적용 (깜빡임 방지)
      ;(function () {
        var LAPTOP_BREAKPOINT = 1280
        var isSmallScreen = window.innerWidth < LAPTOP_BREAKPOINT
        if (isSmallScreen) {
          // 모바일/태블릿: 사이드바 숨김 (오버레이 모드)
          document.documentElement.style.setProperty('--sidebar-width', '0px')
          document.documentElement.style.setProperty('--sidebar-px', '0.75rem')
          document.documentElement.dataset.sidebarCollapsed = 'true'
        } else {
          // 데스크탑: 항상 펼침
          document.documentElement.style.setProperty('--sidebar-width', '280px')
          document.documentElement.style.setProperty('--sidebar-px', '0.75rem')
          document.documentElement.dataset.sidebarCollapsed = 'false'
        }
      })()
    </script>
    <link rel="icon" href="/favicon.png" type="image/png" />
    <!-- Pretendard 폰트 CDN (로컬 폰트 없을 시 fallback) -->
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />
    <!-- Kakao Postcode API -->
    <script src="//t1.kakaocdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
