# HTTP -> HTTPS redirect
server {
    listen 80;
    server_name mindbom.kr;

    # Certbot challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl;
    server_name mindbom.kr;

    # SSL (certbot will manage these)
    ssl_certificate /etc/letsencrypt/live/mindbom.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mindbom.kr/privkey.pem;

    # SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # HSTS
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    # 종합보고서에서 자사 결과 페이지를 iframe으로 임베드하므로 same-origin 프레이밍 허용.
    # 외부 사이트의 프레이밍(clickjacking)은 여전히 차단.
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Content-Security-Policy "frame-ancestors 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # API proxy (only /api/v1/ goes to backend)
    location /api/v1/ {
        limit_req zone=api burst=20 nodelay;

        proxy_pass http://api:8000/api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for AI processing / audio transcription
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # SvelteKit app (includes /api/proxy/* for audio uploads)
    location / {
        limit_req zone=general burst=30 nodelay;

        proxy_pass http://web:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts for large file uploads via SvelteKit proxy
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
