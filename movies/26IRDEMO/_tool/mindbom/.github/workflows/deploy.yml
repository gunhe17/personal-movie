name: Deploy to Lightsail

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    # 아래 command_timeout보다 넉넉해야 한다 — 이쪽이 먼저 끊기면
    # SSH 세션이 정리되지 않은 채 job이 죽는다.
    timeout-minutes: 35
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          timeout: 60s
          # 15m에서 올림. 아래 build가 --no-cache라 매 배포마다 두 이미지를
          # 처음부터 만드는데, 그게 15분을 살짝 넘겨 web 이미지 unpacking
          # 도중에 잘렸다("Run Command Timeout"). 그 뒤의 up -d·마이그레이션이
          # 통째로 실행되지 않아 배포가 아예 없던 일이 됐다.
          #
          # ⚠️ 이건 시간을 벌어 두는 임시 조치다. 근본 원인은 빌드 시간이고,
          # 손대야 할 곳은 셋이다:
          #   1. build의 --no-cache — 락파일이 안 바뀌어도 pnpm install /
          #      uv sync / apt-get을 매번 처음부터 한다. 레이어 캐시는 COPY한
          #      내용의 해시로 무효화되므로 이것 없이도 소스 변경은 반영된다.
          #   2. .dockerignore 부재 — 저장소 어디에도 없다. .git이 통째로
          #      빌드 컨텍스트에 들어가 매번 tar·해시된다(로컬 기준 167MB).
          #      키 유출은 아니다: .env는 .gitignore에 걸려 서버에 생기지
          #      않고, compose가 값을 environment로 다 넘겨 만들 이유도 없다.
          #   3. web Dockerfile 프로덕션 스테이지의 `npm install --omit=dev` —
          #      pnpm이 이미 한 설치를 한 번 더 한다.
          command_timeout: 30m
          script: |
            cd ~/workspace/mindbom

            # Git pull with retry
            for i in {1..3}; do
              if git pull origin main; then
                echo "Git pull successful"
                break
              else
                echo "Git pull failed, retrying in 5 seconds... ($i/3)"
                sleep 5
                if [ $i -eq 3 ]; then exit 1; fi
              fi
            done

            docker compose -f docker-compose.prod.yml --env-file .env.production build --no-cache api web
            docker compose -f docker-compose.prod.yml --env-file .env.production up -d --force-recreate

            # Wait for services to be ready
            sleep 20

            # Migration with retry
            for i in {1..5}; do
              if docker compose -f docker-compose.prod.yml --env-file .env.production exec -T api uv run alembic upgrade head; then
                echo "Migration successful"
                break
              else
                echo "Migration failed, retrying in 10 seconds... ($i/5)"
                sleep 10
                if [ $i -eq 5 ]; then exit 1; fi
              fi
            done

            docker image prune -f

            # Health check
            echo "Running health check..."
            docker compose -f docker-compose.prod.yml --env-file .env.production ps

            # Simple API health check (optional)
            if docker compose -f docker-compose.prod.yml --env-file .env.production exec -T api curl -f http://localhost:8000/health 2>/dev/null || true; then
              echo "API health check passed"
            else
              echo "API health check failed, but continuing..."
            fi

            echo "Deployment completed successfully!"
