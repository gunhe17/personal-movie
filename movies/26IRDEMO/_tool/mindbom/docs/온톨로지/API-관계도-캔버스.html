const world = document.getElementById('world');
const viewport = document.getElementById('viewport');
const svg = document.getElementById('edgeSvg');

// 상태
const pos = {};            // nodeId -> {x,y}
const open = new Set();    // 열린 도메인
const domOf = {};          // resourceId -> domainId
let selected = null;

DATA.nodes.forEach(n => {
  pos[n.id] = { x: n.x, y: n.y };
  n.resources.forEach(rs => { domOf[rs.id] = n.id; });
});

// ── 렌더 ──────────────────────────────
function nodeEl(id) { return world.querySelector(`[data-id="${CSS.escape(id)}"]`); }

function render() {
  world.querySelectorAll('.hub,.res').forEach(el => el.remove());
  DATA.nodes.forEach(n => {
    const el = document.createElement('div');
    el.className = 'hub' + (open.has(n.id) ? ' open' : '');
    el.dataset.id = n.id;
    el.style.left = pos[n.id].x + 'px'; el.style.top = pos[n.id].y + 'px';
    el.style.borderColor = n.color; el.style.background = n.bg;
    el.innerHTML = `<h3 style="color:${n.color}">${n.title}</h3>
      <span class="cnt" style="background:${n.color}">${n.count} endpoints</span>
      <span class="hint">${open.has(n.id) ? '클릭하여 접기' : `리소스 ${n.resources.length}개 — 클릭하여 펼치기`}</span>`;
    world.appendChild(el);
    if (open.has(n.id)) {
      const R = Math.max(180, 60 + n.resources.length * 21);
      n.resources.forEach((rs, i) => {
        if (!pos[rs.id]) {
          const ang = (i / n.resources.length) * Math.PI * 2 - Math.PI / 2;
          pos[rs.id] = { x: pos[n.id].x + Math.cos(ang) * R, y: pos[n.id].y + Math.sin(ang) * (R * 0.8) };
        }
        const re = document.createElement('div');
        re.className = 'res' + (selected === rs.id ? ' sel' : '');
        re.dataset.id = rs.id;
        re.style.left = pos[rs.id].x + 'px'; re.style.top = pos[rs.id].y + 'px';
        re.style.borderColor = n.color;
        re.innerHTML = `<b style="color:${n.color}">${rs.label}</b>` +
          (rs.table ? `<small>${rs.table}</small>` : '') + `<span class="rc">${rs.count}</span>`;
        world.appendChild(re);
      });
    }
  });
  drawEdges();
  applySearch();
}

function anchorOf(id) {
  // 리소스가 접혀 있으면 도메인 허브로 폴백
  if (pos[id] && (domOf[id] === undefined || open.has(domOf[id]))) return pos[id];
  if (domOf[id] !== undefined) return pos[domOf[id]];
  if (pos[id]) return pos[id];
  return null;
}

function drawEdges() {
  svg.innerHTML = '';
  const drawn = new Set();
  DATA.edges.forEach(e => {
    const pa = anchorOf(e.a), pb = anchorOf(e.b);
    if (!pa || !pb) return;
    const key = [Math.round(pa.x), Math.round(pa.y), Math.round(pb.x), Math.round(pb.y)].join(',');
    if (drawn.has(key)) return;
    drawn.add(key);
    const mx = (pa.x + pb.x) / 2, my = (pa.y + pb.y) / 2;
    const dx = pb.x - pa.x, dy = pb.y - pa.y;
    const norm = Math.hypot(dx, dy) || 1;
    const cx = mx - dy / norm * 36, cy = my + dx / norm * 36;
    const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    p.setAttribute('d', `M ${pa.x} ${pa.y} Q ${cx} ${cy} ${pb.x} ${pb.y}`);
    p.setAttribute('class', 'e-' + e.kind);
    svg.appendChild(p);
    const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    t.setAttribute('x', cx); t.setAttribute('y', cy - 4);
    t.setAttribute('text-anchor', 'middle'); t.setAttribute('class', 'edge-label');
    t.textContent = e.label;
    svg.appendChild(t);
  });
}

let scale = 1, tx = 0, ty = 0;
function applyT() { world.style.transform = `translate(${tx}px,${ty}px) scale(${scale})`; }

let drag = null;
viewport.addEventListener('mousedown', e => {
  const node = e.target.closest('.hub,.res');
  if (node) {
    drag = { id: node.dataset.id, sx: e.clientX, sy: e.clientY,
             ox: pos[node.dataset.id].x, oy: pos[node.dataset.id].y, moved: false, isHub: node.classList.contains('hub') };
  } else {
    drag = { pan: true, sx: e.clientX, sy: e.clientY, otx: tx, oty: ty };
    viewport.classList.add('panning');
  }
});
document.addEventListener('mousemove', e => {
  if (!drag) return;
  const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
  if (drag.pan) { tx = drag.otx + dx; ty = drag.oty + dy; applyT(); return; }
  if (Math.abs(dx) + Math.abs(dy) > 3) drag.moved = true;
  const npos = { x: drag.ox + dx / scale, y: drag.oy + dy / scale };
  if (drag.isHub) {
    // 허브 이동 시 자식 리소스도 함께
    const ddx = npos.x - pos[drag.id].x, ddy = npos.y - pos[drag.id].y;
    const dn = DATA.nodes.find(n => n.id === drag.id);
    if (dn) dn.resources.forEach(rs => { if (pos[rs.id]) { pos[rs.id].x += ddx; pos[rs.id].y += ddy; } });
  }
  pos[drag.id] = npos;
  const el = nodeEl(drag.id);
  if (el) { el.style.left = npos.x + 'px'; el.style.top = npos.y + 'px'; }
  if (drag.isHub) {
    const dn = DATA.nodes.find(n => n.id === drag.id);
    if (dn && open.has(dn.id)) dn.resources.forEach(rs => {
      const re = nodeEl(rs.id);
      if (re) { re.style.left = pos[rs.id].x + 'px'; re.style.top = pos[rs.id].y + 'px'; }
    });
  }
  drawEdges();
});
document.addEventListener('mouseup', e => {
  if (drag && !drag.pan && !drag.moved) handleClick(drag.id);
  viewport.classList.remove('panning');
  drag = null;
});
viewport.addEventListener('wheel', e => {
  e.preventDefault();
  const f = e.deltaY < 0 ? 1.12 : 0.89;
  const ns = Math.min(2.2, Math.max(0.25, scale * f));
  const rect = viewport.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  tx = mx - (mx - tx) * (ns / scale);
  ty = my - (my - ty) * (ns / scale);
  scale = ns; applyT();
}, { passive: false });

function handleClick(id) {
  const dn = DATA.nodes.find(n => n.id === id);
  if (dn) {
    if (open.has(id)) { open.delete(id); dn.resources.forEach(rs => delete pos[rs.id]); }
    else open.add(id);
    showDomain(dn);
    render();
  } else {
    selected = id;
    showResource(id);
    render();
  }
}

// ── 우측 패널 ─────────────────────────
const right = document.getElementById('right');
function closePanel() { right.classList.remove('show'); selected = null; render(); }

function epHtml(ep) {
  const path = ep.p.replace(/\{([^}]+)\}/g, '<span class="pp">{$1}</span>');
  const ms = ep.m.map(m => `<span class="m ${m}">${m}</span>`).join('');
  return `<div class="ep">${ms}<span class="path">${path}</span><span class="tag ${ep.s}">${ep.s}</span><div class="fn">${ep.n}</div></div>`;
}

function showResource(id) {
  const eps = DATA.resources[id] || [];
  document.getElementById('rTitle').textContent = id;
  const dn = DATA.nodes.find(n => n.id === domOf[id]);
  const rs = dn && dn.resources.find(r => r.id === id);
  document.getElementById('rMeta').textContent = (rs && rs.table ? '테이블: ' + rs.table + ' · ' : '') + eps.length + '개 엔드포인트';
  document.getElementById('epList').innerHTML = eps.map(epHtml).join('');
  right.classList.add('show');
}

function showDomain(dn) {
  document.getElementById('rTitle').textContent = dn.title;
  document.getElementById('rMeta').textContent = `${dn.count}개 엔드포인트 · 리소스 ${dn.resources.length}개`;
  const wires = DATA.edges.filter(e => {
    const da = domOf[e.a] || e.a, db = domOf[e.b] || e.b;
    return da === dn.id || db === dn.id;
  });
  let html = '';
  if (wires.length) {
    html += `<div style="padding:8px 8px 2px;font-size:11px;color:#5b6577;font-weight:700">크로스도메인 배선 ${wires.length}건</div>`;
    html += wires.map(e => `<div class="wire-item"><b>${e.a}</b> ⇄ <b>${e.b}</b><small>${e.label}</small></div>`).join('');
  }
  html += `<div style="padding:12px 8px 2px;font-size:11px;color:#5b6577;font-weight:700">리소스</div>`;
  html += dn.resources.map(rs => `<div class="wire-item"><b>${rs.label}</b> <span style="color:#5b6577">(${rs.count})</span><small>${rs.table || ''}</small></div>`).join('');
  document.getElementById('epList').innerHTML = html;
  right.classList.add('show');
}

// ── 검색 ─────────────────────────────
const searchBox = document.getElementById('search');
searchBox.addEventListener('input', () => {
  const q = searchBox.value.trim().toLowerCase();
  if (q.length >= 2) {
    const hitDoms = new Set();
    Object.entries(DATA.resources).forEach(([rk, eps]) => {
      if (eps.some(ep => ep.p.toLowerCase().includes(q) || ep.n.toLowerCase().includes(q)))
        hitDoms.add(domOf[rk]);
    });
    hitDoms.forEach(d => d && open.add(d));
  }
  render();
});
function applySearch() {
  const q = searchBox.value.trim().toLowerCase();
  const hubs = world.querySelectorAll('.hub'), ress = world.querySelectorAll('.res');
  if (q.length < 2) { hubs.forEach(h => h.classList.remove('dim')); ress.forEach(r => r.classList.remove('dim','hit')); return; }
  const hitRes = new Set(), hitDom = new Set();
  Object.entries(DATA.resources).forEach(([rk, eps]) => {
    if (eps.some(ep => ep.p.toLowerCase().includes(q) || ep.n.toLowerCase().includes(q))) {
      hitRes.add(rk); hitDom.add(domOf[rk]);
    }
  });
  hubs.forEach(h => h.classList.toggle('dim', !hitDom.has(h.dataset.id)));
  ress.forEach(r => { r.classList.toggle('hit', hitRes.has(r.dataset.id)); r.classList.toggle('dim', !hitRes.has(r.dataset.id)); });
}

// ── 좌측 목록·툴바 ────────────────────
const domList = document.getElementById('domList');
domList.innerHTML = DATA.nodes.map(n =>
  `<div class="dl-item" data-id="${n.id}"><span class="sw" style="background:${n.color}"></span>${n.title}<span class="c">${n.count}</span></div>`).join('');
domList.addEventListener('click', e => {
  const item = e.target.closest('.dl-item');
  if (!item) return;
  const id = item.dataset.id;
  if (!open.has(id)) open.add(id);
  const dn = DATA.nodes.find(n => n.id === id);
  showDomain(dn); render(); focusOn(id);
});

function focusOn(id) {
  const p = pos[id];
  tx = viewport.clientWidth / 2 - p.x * scale;
  ty = viewport.clientHeight / 2 - p.y * scale;
  applyT();
}
function expandAll() { DATA.nodes.forEach(n => open.add(n.id)); render(); }
function collapseAll() {
  DATA.nodes.forEach(n => { open.delete(n.id); n.resources.forEach(rs => delete pos[rs.id]); });
  render();
}
function fitView() {
  scale = Math.max(0.52, Math.min(viewport.clientWidth / 3700, viewport.clientHeight / 2400));
  const cx = 1800, cy = 1150;
  tx = (viewport.clientWidth + 230) / 2 - cx * scale;
  ty = viewport.clientHeight / 2 - cy * scale;
  applyT();
}

render(); fitView();
</script>
</body>
</html>
