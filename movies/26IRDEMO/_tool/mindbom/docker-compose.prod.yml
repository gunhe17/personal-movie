services:
  postgres:
    image: postgres:16-alpine
    container_name: mindbom-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-mindbom}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-mindbom}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-mindbom}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      target: production
    container_name: mindbom-api
    restart: always
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-mindbom}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-mindbom}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      APP_ENV: production
      DEBUG: "false"
      AI_SERVICE_ENABLED: ${AI_SERVICE_ENABLED:-false}
      AI_SERVICE_URL: ${AI_SERVICE_URL:-}
      AI_SCT_SCORE_URL: ${AI_SCT_SCORE_URL:-}
      AI_INTERPRETATION_URL: ${AI_INTERPRETATION_URL:-}
      AI_RORSCHACH_SCORE_URL: ${AI_RORSCHACH_SCORE_URL:-}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-s3}
      S3_BUCKET: ${S3_BUCKET}
      S3_REGION: ${S3_REGION:-ap-northeast-2}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      AUDIT_ENABLED: "true"
      FRONTEND_URL: ${FRONTEND_URL}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      SMTP_SERVER: ${SMTP_SERVER:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      HOST_EMAIL: ${HOST_EMAIL:-}
      HOST_PASSWORD: ${HOST_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: production
    container_name: mindbom-web
    restart: always
    environment:
      API_URL: http://api:8000/api/v1
      ORIGIN: ${FRONTEND_URL}
      BODY_SIZE_LIMIT: "Infinity"
    depends_on:
      - api
    networks:
      - internal

  nginx:
    image: nginx:alpine
    container_name: mindbom-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    depends_on:
      - api
      - web
    networks:
      - internal

volumes:
  postgres_data:
    driver: local

networks:
  internal:
    driver: bridge
