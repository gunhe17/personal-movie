<!doctype html>
<meta charset="utf-8">
<title>뱃지 · 목차 표시</title>
<!--
  ?t=글자&g=바탕&i=글자색[&n=번호][&m=tab]
    기본  절차 표시줄(motion-stage/stages/steps.html)과 같은 알약. n을 주면 왼쪽에 강조색 번호 점.
    m=tab 화면 위 모서리에 물리는 탭 — 아래 모서리만 둥글다. 캔버스 맨 위에 붙여 굽는다(프레임 y=0에 그대로 맞춘다).
  1920 기준 px로 굳히고 zoom 3배로 굽는다. 배경 투명. build.mjs가 굽는다.
-->
<style>
:root{ --f-m:'SF Mono',ui-monospace,monospace }
html,body{margin:0;height:100%;background:transparent;display:grid;justify-items:center;align-items:center;
  font-family:'Pretendard','Apple SD Gothic Neo',system-ui,sans-serif}
body.tab{align-items:start}
.badge{zoom:3;display:flex;align-items:center;gap:10px;padding:16px 26px;border-radius:99px;
  font-size:19px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;
  box-shadow:inset 0 0 0 1.3px rgba(25,30,33,.10),0 9.6px 34.6px rgba(25,30,33,.16)}
.badge.n{padding-left:12px}
.dot{width:27px;height:27px;border-radius:50%;display:grid;place-items:center;
  font-family:var(--f-m);font-size:13px;letter-spacing:.02em}
/* 탭 — 위는 화면 밖, 아래만 둥글다 */
.badge.tab{padding:14px 24px 15px 14px;border-radius:0 0 16px 16px;
  box-shadow:0 12px 30px rgba(6,12,20,.26)}
.badge.tab .dot{width:26px;height:26px;border-radius:7px;font-size:12.5px}
</style>
<div class="badge" id="b"></div>
<script>
const q = new URLSearchParams(location.search), b = document.getElementById('b');
const n = q.get('n'), tab = q.get('m') === 'tab';
b.style.background = q.get('g') || '#2F6BFF';
b.style.color = q.get('i') || '#FFFFFF';
if (tab){ b.classList.add('tab'); document.body.classList.add('tab'); }
if (n){
  b.classList.add('n');
  const d = document.createElement('div');
  d.className = 'dot'; d.textContent = n;
  d.style.background = q.get('a') || '#2F6BFF'; d.style.color = q.get('oa') || '#FFFFFF';
  b.appendChild(d);
}
b.appendChild(document.createTextNode(q.get('t') || '기존'));
</script>
